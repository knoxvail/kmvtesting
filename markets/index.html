<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Market Screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <div class="topline">
        <a class="home" href="/">&larr; kmvtesting</a>
        <button class="btn-ghost" id="export-btn" type="button">Copy data as JSON</button>
      </div>
      <p class="kicker">Senior housing &middot; 4% LIHTC acq-rehab</p>
      <h1>Market Screen</h1>
      <p class="routes"><span class="from">SNA &rarr;</span> PHX &middot; SLC &middot; DFW / DAL &middot; BOI &middot; AUS &middot; SAT &middot; DEN / COS &middot; CLT &middot; HOU / IAH &middot; SUN</p>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="top-row">
        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search" type="search" placeholder="Search markets, airports, properties, brokers" aria-label="Search markets">
        </div>
        <div class="recent-block" aria-label="Recently viewed">
          <h2 class="section-label">Recent</h2>
          <div class="recent-row" id="recent-row"></div>
        </div>
      </div>

      <section aria-label="Markets">
        <h2 class="section-label">Markets</h2>
        <div class="city-grid" id="city-grid"></div>
      </section>
    </div>
  </main>

  <footer>Rows and notes added in the browser save locally. Copy data as JSON before switching machines.</footer>

  <noscript><p style="max-width:1020px;margin:0 auto;padding:1rem 1.25rem;">This page renders with JavaScript. Enable it to see the screen.</p></noscript>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
