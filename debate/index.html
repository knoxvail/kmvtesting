<head>

<title>Debate Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: a reference desk. Search and the list of moves on the left, the full answer on the right,
   colored by where the argument has gone: election (slate), free will (blue), justice (rust), as on the printed map. */
:root {
  --bg: #f3f5f8; --panel: #ffffff; --fg: #1b2230; --muted: #5b6475; --line: #d9dee7; --soft: #eaeef4;
  --elect: #3b4658; --fw: #2459b0; --jus: #c2532a; --focus: #2459b0;
  --f-read: 'Literata', Georgia, 'Times New Roman', serif;
  --f-ui: 'IBM Plex Sans', 'Segoe UI', Roboto, Arial, sans-serif;
  --f-code: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161d; --panel: #1a2029; --fg: #e6e9ef; --muted: #9aa3b2; --line: #2c3440; --soft: #222a35;
  --elect: #aeb8c8; --fw: #7aa3ea; --jus: #ea8b63; --focus: #7aa3ea; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12161d; --panel: #1a2029; --fg: #e6e9ef; --muted: #9aa3b2; --line: #2c3440; --soft: #222a35;
  --elect: #aeb8c8; --fw: #7aa3ea; --jus: #ea8b63; --focus: #7aa3ea; color-scheme: dark; }
html, body { height: 100%; width: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; margin: 0; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.shell { display: grid; grid-template-rows: auto 1fr; height: 100vh; height: 100dvh; width: 100%; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand b { font-family: var(--f-read); font-size: 19px; font-weight: 600; letter-spacing: .01em; }
.brand span { color: var(--muted); font-size: 12.5px; max-width: 64ch; }
nav { display: flex; flex-wrap: wrap; gap: 4px; margin-left: auto; }
nav button { background: none; border: 1px solid transparent; border-radius: 6px; padding: 6px 11px; cursor: pointer; color: var(--muted); font-weight: 500; }
nav button[aria-selected="true"] { color: var(--fg); border-color: var(--line); background: var(--soft); }
nav kbd { font-family: var(--f-code); font-size: 11px; color: var(--muted); margin-left: 4px; }
main { min-height: 0; }
.pane { height: 100%; }
.split { display: grid; grid-template-columns: clamp(300px, 26vw, 440px) 1fr; height: 100%; min-height: 0; }
.side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.searchbox { padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.searchbox input { width: 100%; font: inherit; font-size: 15.5px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--fg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; cursor: pointer; background: none; color: var(--muted); }
.chip[aria-pressed="true"] { color: var(--fg); background: var(--soft); border-color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); }
.list { overflow-y: auto; flex: 1; padding: 6px; }
.item { display: grid; grid-template-columns: 34px 1fr; gap: 2px 8px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 8px; border-radius: 7px; cursor: pointer; }
.item:hover { background: var(--soft); }
.item[aria-current="true"] { background: var(--soft); box-shadow: inset 3px 0 0 var(--c, var(--elect)); }
.item .code { grid-row: span 2; }
.item .t { font-weight: 500; font-size: 14px; }
.item .s { font-size: 12.5px; color: var(--muted); grid-column: 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.section-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 8px 4px; }
.code { font-family: var(--f-code); font-weight: 500; font-size: 13px; color: var(--c, var(--elect)); }
.s-Election { --c: var(--elect); } .s-Freewill { --c: var(--fw); } .s-Justice { --c: var(--jus); }
.detail { overflow-y: auto; padding: 26px clamp(16px, 4vw, 48px) 60px; min-width: 0; }
.detail .inner { max-width: 1280px; }
@media (min-width: 1500px) { .detail .inner { columns: 1; } .say p { font-size: 22px; } body { font-size: 16px; } }
.eyebrow { font-family: var(--f-code); font-size: 12.5px; color: var(--c); letter-spacing: .04em; }
h1 { font-family: var(--f-read); font-weight: 600; font-size: 26px; line-height: 1.25; margin: 4px 0 16px; text-wrap: balance; }
.say { border-left: 4px solid var(--c, var(--elect)); background: var(--panel); padding: 14px 18px; border-radius: 0 8px 8px 0; margin: 0 0 18px; }
.say .lab, .blk .lab { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: block; margin-bottom: 4px; }
.say p { font-family: var(--f-read); font-size: 20px; line-height: 1.4; margin: 0; }
.blk { margin: 0 0 16px; }
.blk p { margin: 0; }
.blk ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.hold { display: flex; gap: 10px; align-items: baseline; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.hold b { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.they { color: var(--muted); font-style: italic; }
.codelink { font-family: var(--f-code); font-size: .9em; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; background: var(--soft); cursor: pointer; color: var(--fg); }
.codelink:hover { border-color: var(--muted); }
.single { overflow-y: auto; height: 100%; padding: 24px clamp(16px, 4vw, 48px) 60px; }
.single .inner { max-width: none; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
.toolbar input { flex: 1 1 260px; font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--fg); }
.verses { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 12px; }
.verse { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.verse.theirs { border-style: dashed; }
.verse .r { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.verse .r b { font-size: 14px; }
.verse .side { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.verse q { font-family: var(--f-read); font-size: 15.5px; quotes: "\201C" "\201D"; }
.verse .u { font-size: 13px; color: var(--muted); }
.verse .cs { display: flex; flex-wrap: wrap; gap: 4px; }
.qs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 12px; padding: 0; margin: 0; list-style: none; counter-reset: q; }
.qs li { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; counter-increment: q; display: grid; grid-template-columns: 26px 1fr; gap: 0 8px; }
.qs li::before { content: counter(q); font-family: var(--f-code); color: var(--muted); }
.qs .q { font-family: var(--f-read); font-size: 17px; font-weight: 600; }
.qs .n { grid-column: 2; color: var(--muted); font-size: 14px; margin-top: 4px; }
table { border-collapse: collapse; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
td, th { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
td:first-child { font-weight: 600; width: 30%; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px; margin-bottom: 16px; }
.card h2 { font-family: var(--f-read); font-size: 19px; margin: 0 0 10px; font-weight: 600; }
.card ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.lead { font-family: var(--f-read); font-size: 19px; line-height: 1.45; }
.closing { border-left: 4px solid var(--jus); }
.mapwrap { overflow-x: auto; }
.mapwrap img { display: block; max-width: 100%; width: min(1344px, 100%); margin: 0 auto; border-radius: 8px; background: #fff; }
.empty { color: var(--muted); padding: 20px 8px; }
@media (max-width: 760px) {
  .split { grid-template-columns: 1fr; grid-template-rows: auto auto; height: auto; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); }
  .list { max-height: 40vh; }
  .shell { height: auto; }
  nav { margin-left: 0; }
}
@media (prefers-reduced-motion: no-preference) { .item, .chip, nav button { transition: background .12s; } }
</style>
</head>
<body>


<div class="shell">
  <header>
    <div class="brand"><b>Debate Desk</b><span id="question"></span></div>
    <nav id="tabs" role="tablist"></nav>
  </header>
  <main id="main"></main>
</div>

<script>
const D = {"question": "When the Bible says God chose his people, did he choose which individuals would be saved, or did he choose to save a people in Christ that anyone can join through faith?", "position": ["Christ died for all, and his death is sufficient for all, and efficient for the elect.", "Before creation God chose particular people to bring to faith, for reasons in himself and not for anything he foresaw in them.", "We choose willingly and answer for what we choose, and God's plan is carried out through those choices."], "opening": {"firstSentence": "\"God chose who would be saved before the creation of the world. That choice was made before anyone had done anything good or bad, it rests on his call and his mercy, and everyone the Father gives to the Son will come.\" (Ephesians 1:4-5, Romans 9:11-16, John 6:37)", "steps": ["No one can come to Christ unless the Father draws them, and Jesus raises up the one drawn at the last day (John 6:44).", "Everyone the Father gives him comes, and he loses none of them (John 6:37-39).", "Not everyone is raised to life, so not everyone is drawn in that sense. What finally decides who comes is the Father's drawing. Paul says that was settled before creation, \"in accordance with his pleasure and will\" (Ephesians 1:4-5)."], "picture": "\"Paul's own picture for this is adoption (Ephesians 1:5). A child doesn't apply to be adopted. His parents choose him by name before he knows them, and the love he grows up with is still his own.\"", "notSaying": "\"I'm not saying we're robots, and I'm not saying God made anyone for hell.\"", "admit": "\"I can't tell you why he doesn't do this for everyone. So here's mine for you: what finally decides whether a particular person ends up in Christ?\"", "whereTheyHit": "\"Who\" in the first sentence: they'll say Paul means a group (E5). \"His call and his mercy\": they'll say faith isn't the effort Paul excludes (E1). Step 1: they'll say everyone is drawn, or that the one raised is whoever comes. Say \"most naturally\" and point to 6:39 (E3). Save the ice cube for when someone says \"robots\" (F1)."}, "exitRule": "Answer in one sentence, then come back to the text. If they ask a second time, go to the topic sheet and answer in full. A bare \"we'll get to that\" sounds like you have nothing.", "doors": {"freeWill": "Short answer: I chose willingly, and God is the reason I wanted to. First, though, does this text say God chose individuals?", "justice": "Short answer: nobody gets worse than he deserves, and I only partly know why mercy isn't given to all (Romans 9:22-23). Can we settle what the text says and then come back?"}, "entries": [{"code": "E1", "section": "Election", "title": "God chose individuals before creation, for reasons in himself", "triggers": ["He chose the ones he foresaw would believe.", "He chose the ones he knew would believe.", "Romans 8:29 says those he foreknew, he predestined."], "oneLiner": "Paul gives the reason, and it's God's call and mercy. Where does he give foreseen faith?", "sayFirst": "", "claim": "", "read": "\"He chose us in him before the creation of the world ... in accordance with his pleasure and will\" (Ephesians 1:4-5). \"It does not, therefore, depend on human desire or effort, but on God's mercy\" (Romans 9:16).", "theySay": "\"He chose the ones he knew would believe. Romans 8:29 says those he foreknew, he predestined.\"", "points": ["Paul gives the reason before the twins \"had done anything good or bad\": \"not by works but by him who calls\" (Romans 9:11-12). The basis is the caller.", "Romans 8:29 says \"those God foreknew.\" What he foreknew is people. Their faith isn't mentioned.", "The word is used the same way of Israel, \"his people, whom he foreknew\" (Romans 11:2), and of Christ in 1 Peter 1:20, where the NIV has \"chosen.\"", "Notice what Paul never says: that God chose them because he foresaw their faith.", "\"1 Peter 1:2 says chosen according to foreknowledge.\" Peter uses the same word of Christ in 1:20, where the NIV has \"chosen,\" so it can mean more than knowing in advance. Whether it does in 1:2 rests on Romans 9:11-12. The verse also says chosen \"to be obedient,\" so obedience is the goal of the choice.", "\"Faith isn't a work (Romans 4:5).\" Agreed, and Paul sets faith against effort himself (9:30-32). So don't argue that faith is a work. Argue from the basis Paul names: \"him who calls\" (9:12) and \"on whom\" he has mercy (9:15, 18).", "\"God can't know a person and ignore what he'll do.\" He knows their faith too. The question is whether it's the reason he chose them. Paul says the reason is \"him who calls\" (9:12)."], "admit": "The word can mean plain advance knowledge, as in Acts 26:5. Your case is about what it means when God is the one knowing and people are the object.", "hold": "Romans 9:11-12 and 9:15-16. Ask: \"Paul gives the reason for the choice. Where does he give foreseen faith as the reason?\"", "goesTo": "If they shift to \"he chose a group,\" go to E5. If they say \"he knows but doesn't cause,\" that is the free will door: hold once, then F6. More verses: V1.", "other": []}, {"code": "E2", "section": "Election", "title": "God's choice comes before faith and produces it", "triggers": ["'Appointed' can mean 'disposed.'", "So people can't believe even if they want to?", "And Jesus tells the men of John 10 to believe (10:38)."], "oneLiner": "The giving comes before the coming, and the sheep are his before they hear.", "sayFirst": "", "claim": "", "read": "\"All those the Father gives me will come to me\" (John 6:37). \"All who were appointed for eternal life believed\" (Acts 13:48). \"You do not believe because you are not my sheep\" (John 10:26).", "theySay": "\"'Appointed' can mean 'disposed.' Two verses earlier Paul tells the Jews they \"do not consider yourselves worthy\" (Acts 13:46), so people decide. And Jesus tells the men of John 10 to believe (10:38).\"", "points": ["Every major translation has \"appointed,\" \"ordained\" or \"destined,\" and the verb is pluperfect: the appointing was already in place when they believed. Be honest that a minority of scholars read it as \"disposed.\"", "Acts 13:46. Agree with it. Their rejection was their own act and their own fault. Luke puts the blame for unbelief on them (13:46) and traces belief to God's appointing (13:48). Both stand.", "In John 10:16 the \"other sheep\" are Gentiles who haven't heard yet, and Jesus already calls them his.", "Jesus invites everyone, including people who won't come. After the crowds refused, John says God's hardening meant \"they could not believe\" (12:37-40). That is judgment on people already refusing, so don't use it for inability before grace.", "If \"gives\" in John 6:37 only meant \"foresees who will come,\" the verse would say \"all who come will come.\""], "admit": "", "hold": "John 6:37 with John 10:16. The giving comes before the coming, and the sheep are his before they hear.", "goesTo": "\"So people can't believe even if they want to?\" Hold: \"Nobody who wants to come is turned away. The question is why anyone wants to.\" Then E3, or F2 if they press. More verses: V2.", "other": []}, {"code": "E3", "section": "Election", "title": "No one comes unless God acts first", "triggers": ["God draws everyone, so anyone can come.", "God draws everyone."], "oneLiner": "In John 6:44 the one drawn is the one raised up at the last day.", "sayFirst": "", "claim": "", "read": "\"No one can come to me unless the Father who sent me draws them, and I will raise them up at the last day\" (John 6:44). \"No one can come to me unless the Father has enabled them\" (John 6:65).", "theySay": "\"God draws everyone. John 12:32 says 'I will draw all people to myself.' And 6:45 shows the drawing is teaching, so those who listen come.\"", "points": ["In 6:44 the person drawn is the person raised up. If everyone is drawn that way, everyone is saved.", "6:45 says \"Everyone who has heard the Father and learned from him comes to me.\" It never fails. If they read 6:45a, \"They will all be taught by God,\" Jesus is quoting Isaiah 54:13, \"all your children,\" the covenant people, and 6:44 has already made that teaching the drawing.", "Jesus uses it to explain unbelief (6:64-65). A grace everyone has can't explain why some don't believe.", "John 12:32 is said when Greeks come asking for Jesus (12:20-21), and 12:33 ties it to his death. Don't narrow \"all.\" Grant a drawing that goes out to everyone through his death, like the outward call, which fits your view that he died for all. The drawing in 6:44 is the one that ends in being raised up.", "\"Drawn doesn't mean raised. 'Them' is whoever chooses to come.\" Most naturally, the one drawn and the one raised are the same person. And 6:39 says Jesus loses none of those the Father gives him.", "\"'Draw' means to woo, and people can say no.\" Don't argue from the word itself. The same word is in 12:32, and if it always gets its result, 12:32 makes everyone saved. Argue from the sentence: the one drawn is raised up.", "\"That was before the cross. Now he draws everyone (12:32).\" The drawn are raised \"at the last day,\" which hasn't come yet. People still heard and didn't believe after the cross, and Luke still says the Lord \"opened her heart\" (Acts 16:14)."], "admit": "", "hold": "John 6:44 and 6:65 together. Ask: \"Can a person come to Christ before God acts on them?\"", "goesTo": "If they say no, you agree grace comes first, and the question left is who receives it. Back to E1. \"Grace can be resisted\" goes to F8. \"Faith comes first, then new life\" goes to F9. \"Then why does God command everyone to repent?\" goes to F3. \"Then it isn't fair to judge them\" goes to J2. More verses: V3.", "other": []}, {"code": "E4", "section": "Election", "title": "Romans 9 is about individuals and salvation", "triggers": ["Romans 9 is about nations.", "Paul's own conclusion is faith.", "Israel failed 'because they pursued it not by faith' (9:32)."], "oneLiner": "Genesis 25 and Malachi 1 are. Paul's question is why individual Israelites aren't saved.", "sayFirst": "", "claim": "Paul uses those examples to explain why individual Israelites are or are not saved.", "read": "\"Not all who are descended from Israel are Israel\" (9:6). \"Then why does God still blame us? For who is able to resist his will?\" (9:19). \"Even us, whom he also called, not only from the Jews but also from the Gentiles\" (9:24).", "theySay": "\"Paul's own conclusion is faith. Israel failed 'because they pursued it not by faith' (9:32). And the hardened can be grafted back in (11:23).\"", "points": ["The objection fits best if Paul means persons: his grief in 9:3 is over their salvation, and 9:24 applies it to \"us.\" Don't overstate it. Paul does harden Israel as a people (11:7, 11:25).", "9:32 gives the human side of the same event. It doesn't cancel 9:16.", "11:23 is about Israel as a people over time. The hardening is \"in part\" and lasts \"until the full number of the Gentiles has come in\" (11:25)."], "admit": "", "hold": "Romans 9:6 and 9:19.", "goesTo": "9:19 is itself the justice door, and Paul opens it. \"Then why does he blame us?\" goes to J2. \"So he makes people for hell?\" goes to J5. More verses: V1 for your side, V8 for theirs.", "other": ["Concede first. Genesis 25:23 and Malachi 1:2-3 were about nations in their original settings. Say it before they do.", "Don't overclaim. 9:22 says \"prepared for destruction\" and doesn't name who prepared them. Chapter 11 is their strongest ground, and 11:22 (\"you also will be cut off\") is hard for your side."]}, {"code": "E5", "section": "Election", "title": "\"God chose a people in Christ, and anyone can join by faith\"", "triggers": ["God chose a people in Christ, and anyone can join by faith", "He chose a people in Christ, and anyone can join.", "Ephesians 1 says he chose us 'in him.' Christ is the Chosen One.", "God chose the group, like a ship bound for harbor, and anyone can board by faith."], "oneLiner": "Election is in Christ, agreed. Who decides who is in?", "sayFirst": "", "claim": "", "read": "\"Names have not been written in the book of life from the creation of the world\" (Revelation 17:8). \"He predestined us for adoption to sonship\" (Ephesians 1:5). \"God chose you as firstfruits to be saved through the sanctifying work of the Spirit and through belief in the truth\" (2 Thessalonians 2:13).", "theySay": "\"Ephesians 1 says he chose us 'in him.' Christ is the Chosen One. God chose the group, like a ship bound for harbor, and anyone can board by faith.\"", "points": ["\"If no passenger list was written, what is the book of names from the creation of the world in Revelation 17:8?\"", "Argue from the names. Israel as a nation had \"the adoption to sonship\" (Romans 9:4), so don't say a group can't be adopted.", "\"Anyone can join\" assumes anyone is able to. John 6:44 says no one can come unless the Father draws them.", "\"2 Thessalonians 2:13 says chosen through belief.\" Read the whole verse yourself before they do. \"Through\" goes with \"saved.\" God chose them to be saved by that road. The same phrase names the Spirit's sanctifying work, and nobody says God chose people because he foresaw their holiness.", "\"Ephesians 1:13 says you were included in Christ when you heard and believed.\" Agreed. That is when it happened in their lives. Verse 4 is when God chose, \"before the creation of the world.\" Faith is how a person enters Christ. The question is still who gives the faith.", "\"Israel was chosen as a nation, and members were cut off.\" Paul says so (Romans 11:22), and it is hard for your side. He also says there is a chosen remnant inside the nation (11:5)."], "admit": "", "hold": "Revelation 17:8 and John 6:37. Ask: \"What finally decides whether a particular person ends up in Christ?\"", "goesTo": "He'll say \"their faith.\" Ask where the faith comes from, and you are back in E3. If he says \"from their own choice,\" that is the free will door: F5. If he raises names being blotted out, see V8.", "other": ["This is your Vineyard friend's view, called corporate election. Serious scholars hold it, so treat it with respect.", "Agree first. Election is \"in Christ\" and it has a group side. Christ is the Father's chosen one (Luke 9:35). You differ on one thing: who decides who is in."]}, {"code": "E6", "section": "Election", "title": "\"God wants all people to be saved\"", "triggers": ["God wants all people to be saved", "God our Savior, who wants all people to be saved", "Not wanting anyone to perish", "Then he'd choose everyone."], "oneLiner": "I believe that verse. He truly desires it.", "sayFirst": "", "claim": "", "read": "", "theySay": "\"God our Savior, who wants all people to be saved\" (1 Timothy 2:3-4). \"Not wanting anyone to perish\" (2 Peter 3:9). \"I take no pleasure in the death of the wicked\" (Ezekiel 33:11). \"How often I have longed to gather your children together ... and you were not willing\" (Matthew 23:37).", "points": ["\"I believe those verses. God truly desires it.\" Don't explain them away.", "God wills at two levels: what he desires, and what he has decided to bring about. Your whole case leans on this. The texts that show God not bringing about what he desires are 1 Samuel 2:25 and Lamentations 3:32-33, so lead with those. Acts 2:23 and Luke 22:22 show God planning what he forbids, which Arminians grant in some form. Be honest that all four involve people already set on sin. Applying the two levels to election is an inference from them.", "Acts 2:23. Jesus was handed over \"by God's deliberate plan,\" and \"wicked men\" killed him. God forbids murder, and he planned the cross.", "Luke 22:22. \"The Son of Man will go as it has been decreed. But woe to that man who betrays him!\"", "1 Samuel 2:25. Eli's sons \"did not listen ... for it was the LORD's will to put them to death.\" The same God says he takes no pleasure in the death of the wicked.", "Lamentations 3:32-33. He \"brings grief,\" and he \"does not willingly bring affliction.\"", "\"You need two levels too. Your God wants everyone saved and doesn't save everyone. You say he could only do it by forcing people, and forced love isn't love. I say he has a purpose he has only partly told us (Romans 9:22-23).\""], "admit": "", "hold": "\"We both have a God who wants all saved and doesn't save all. We differ on why.\" Then Romans 11:33.", "goesTo": "This is the shortest road out of election. \"Then he doesn't really love them\" is the justice door: J4. \"My answer is free will\" is the other door: F1. \"Their unwillingness beat his grace\" goes to F8. All of them end at \"Where the two close in\" on the topic sheet. More verses: V5.", "other": ["This is their strongest argument. Take it slowly.", "On Matthew 23:37. Grant it. Jesus truly longed to gather them, and they truly refused. That is the first level of his will, and their refusal is the willing sin you already affirm. The woes just before it are aimed at the leaders (23:13), but don't rest on that. One difference to admit: their God has a stated reason, that love can't be forced. Yours could make anyone freely love him, as he did with Paul, so your only reason is Romans 9:22-23. The two views share the mystery, not the answer.", "Don't use the \"all kinds of people\" reply. The same letter calls God \"the Savior of all people, and especially of those who believe\" (1 Timothy 4:10)."]}, {"code": "E7", "section": "Election", "title": "\"Christ died for all\"", "triggers": ["Christ died for all", "Then why isn't everyone saved?", "And why would he die for people he didn't choose?"], "oneLiner": "Yes. I agree.", "sayFirst": "", "claim": "", "read": "\"He is the atoning sacrifice for our sins, and not only for ours but also for the sins of the whole world\" (1 John 2:2).", "theySay": "\"Then why isn't everyone saved? And why would he die for people he didn't choose?\"", "points": ["The payment is applied through faith. Believers were once \"by nature deserving of wrath\" (Ephesians 2:3), though Christ had already died for them. Of the one who rejects the Son, \"God's wrath remains on them\" (John 3:36).", "It makes the offer honest. You can say \"Christ died for you\" to anyone.", "Father and Son share both aims: a death given for the world (John 3:16), and a people who will surely come (John 6:37). Never say Jesus wanted to save more people than the Father allowed.", "\"That's double jeopardy. He paid, and they still pay.\" His death isn't a bank transfer that clears the account by itself. God applies it through faith. You were under wrath yourself until you believed (Ephesians 2:3). Their view has the same shape: Christ died for people who are lost.", "\"So unbelief condemns, and unbelief is a human act. Human response decides.\" Yes, unbelief condemns (John 3:18), and it is their own act. Faith is the hand that receives. Where that faith comes from is E3.", "\"Then the cross is universal in name only.\" It gives everyone a true offer, and it means nobody is lost for lack of a sacrifice. On their view the cross also saves nobody by itself.", "\"Jesus says, 'I am not praying for the world' (John 17:9).\" Five-pointers use this one. That prayer is for his disciples, and in it he asks \"that the world may believe\" (17:21). If they ask whether the Son intended to save the lost, say he intended a real provision for all and the sure salvation of his people. That view is called hypothetical universalism, and John Davenant held it at the Synod of Dort."], "admit": "", "hold": "\"Christ died for all. God chose whom he would bring to faith.\"", "goesTo": "Back to E1. This one rarely leaves election. More verses: V10.", "other": ["Agree with them. You are four-point. Say it plainly: \"Yes. Christ died for all.\""]}, {"code": "F1", "section": "Free will", "title": "\"So we're robots.\" \"Love has to be free or it isn't love.\"", "triggers": ["So we're robots.", "Love has to be free or it isn't love.", "Love has to be free."], "oneLiner": "A robot has no wants. I chose what I most wanted, and God is why I wanted it.", "sayFirst": "\"Which kind of free do you mean? Nobody forcing me, or able to go either way?\"", "claim": "", "read": "", "theySay": "", "points": ["You claim the first kind. You act on what you want and nobody forces you. You deny the second, that you could have gone either way with everything the same.", "A robot has no wants. You have them, and you follow the deepest one every time. God works on the wanting.", "The ice cube. \"We're all frozen. God thaws me and I feel how cold I am. Nobody drags me to the fire. I couldn't do otherwise and I wouldn't want to.\"", "Paul. God \"set me apart from my mother's womb and called me by his grace\" (Galatians 1:15), then stopped him on the Damascus road. Ask whether Paul's love for Christ was fake.", "Their gap. If nothing settles a choice, what makes it yours and not chance? Careful: they can ask you the same about Adam's first sin."], "admit": "\"I can't show you the machinery. Scripture says both, and I hold both.\"", "hold": "Acts 4:27-28. Herod and Pilate \"did what your power and will had decided beforehand should happen,\" and they were guilty. Also Philippians 2:12-13.", "goesTo": "", "other": []}, {"code": "F2", "section": "Free will", "title": "\"If you couldn't have done otherwise, it wasn't a real choice.\"", "triggers": ["If you couldn't have done otherwise, it wasn't a real choice.", "If I couldn't do otherwise, it wasn't a real choice.", "If you couldn't do otherwise, it wasn't a real choice."], "oneLiner": "Nothing stopped them except what they wanted. Nobody who wants to come is turned away.", "sayFirst": "\"There are two kinds of can't.\"", "claim": "", "read": "", "theySay": "", "points": ["A man in chains can't walk out. A man who hates his brother can't bring himself to forgive him. Nothing holds the second man except what he wants. Scripture's \"cannot\" about sinners is the second kind.", "Jesus puts both in one breath. \"No one can come to me\" (John 6:44) and \"you refuse to come to me to have life\" (John 5:40). \"Why is my language not clear to you? Because you are unable to hear what I say\" (John 8:43).", "\"It is impossible for God to lie\" (Hebrews 6:18). He can't do otherwise, and nobody thinks his truthfulness is unfree or deserves no praise.", "Augustine's four states. Before the fall we were able to sin and able not to. After it, not able not to sin. Under grace, able not to sin. In glory, not able to sin. The saints in heaven can't sin and they are the freest people there are.", "The things you can't bring yourself to do are often the most yours. A good mother can't abandon her child."], "admit": "This is a philosophical position called compatibilism, and plenty of serious Christians reject it. Their intuition is the common one. Adam before the fall is the hard case. Say \"able not to sin\" means he could have obeyed if he had willed to, and nothing outside him forced the choice. Admit the fall was still inside God's plan. How a good will first wanted evil is a mystery on every view.", "hold": "John 5:40 with John 6:44. They couldn't, and the reason they couldn't is that they wouldn't.", "goesTo": "", "other": []}, {"code": "F3", "section": "Free will", "title": "\"Commands assume we're able. 'Choose life.' 'Repent.'\"", "triggers": ["Commands assume we're able. 'Choose life.' 'Repent.'", "Commands assume we're able."], "oneLiner": "A command shows what we owe. 'Be perfect' doesn't mean we can.", "sayFirst": "", "claim": "", "read": "", "theySay": "", "points": ["A command shows what we owe. \"Be perfect, therefore, as your heavenly Father is perfect\" (Matthew 5:48). Nobody concludes from that verse that we can.", "A command can be sincere when the hearer won't obey it. A man who can't pay still owes the debt.", "Jesus commands a dead man. \"Lazarus, come out!\" (John 11:43). When the Spirit speaks inwardly, the word carries the power to obey it. The outward call alone doesn't.", "God promises to give what he commands. \"I will give you a new heart ... and move you to follow my decrees\" (Ezekiel 36:26-27). He does it for his own name's sake, for people still profaning it (36:22).", "Augustine prayed, \"Give what you command, and command what you will.\""], "admit": "Plain commands read more naturally on their view. Say so before you give the verses.", "hold": "Ezekiel 36:26-27.", "goesTo": "", "other": ["\"Why would God beg people who can't come?\" This is their strongest question. Three answers, then one admission.", "They can't because they won't. He isn't begging a man with no legs to walk. He's begging a man running the other way to turn around. Nothing holds that man back except what he wants: \"you refuse to come to me to have life\" (John 5:40).", "His voice is how he turns people. God tells Ezekiel to preach to dry bones, and the preaching is what raises them (Ezekiel 37:4-10).", "The offer is true for everyone who hears it. \"Whoever comes to me I will never drive away\" (John 6:37).", "Admit this. It doesn't explain why God pleads with someone whose heart he could change and doesn't. That is the weakest joint in your view. It leads to E6 and the closing question.", "Careful with Deuteronomy 30. \"Choose life\" (30:19) does follow the promise of a circumcised heart (30:6). That promise comes after \"when you ... return to the LORD\" (30:2), so they can turn it around on you. Lead with Ezekiel 36."]}, {"code": "F4", "section": "Free will", "title": "\"If it's all decided, why pray or share the gospel?\"", "triggers": ["If it's all decided, why pray or share the gospel?", "Then why pray or share the gospel?"], "oneLiner": "Because God uses both to bring his people in. Paul wrote Romans 9 and kept preaching.", "sayFirst": "", "claim": "", "read": "", "theySay": "", "points": ["God decided the means along with the end. He promised Paul every life on the ship (Acts 27:22-24). Paul still said, \"Unless these men stay with the ship, you cannot be saved\" (27:31).", "Election is why Paul kept preaching. \"Keep on speaking ... because I have many people in this city\" (Acts 18:9-10). \"I endure everything for the sake of the elect\" (2 Timothy 2:10).", "\"Faith comes from hearing the message\" (Romans 10:17). Someone has to speak.", "Turn it around on prayer. When you pray \"Lord, save my friend,\" you are asking God to change a heart. Packer's point is that on our knees we all pray like Calvinists.", "Prayer asks and then yields. \"Not my will, but yours be done\" (Luke 22:42)."], "admit": "", "hold": "Acts 18:9-10.", "goesTo": "", "other": []}, {"code": "F5", "section": "Free will", "title": "\"I chose God. My faith was my decision.\"", "triggers": ["I chose God. My faith was my decision.", "I chose God.", "Then it's arbitrary."], "oneLiner": "You did. I'm asking where the wanting came from.", "sayFirst": "\"You did choose. Nobody believed for you.\"", "claim": "", "read": "", "theySay": "", "points": ["If the difference is something in him, Paul presses on it as a principle (the verse itself is about gifts in Corinth). \"What do you have that you did not receive? And if you did receive it, why do you boast as though you did not?\" (1 Corinthians 4:7). God chose as he did \"so that no one may boast before him\" (1 Corinthians 1:29).", "If the difference is nothing in him, it lies with God. That is election.", "On their view God could do all he does and still end with no one saved. Jesus says those the Father gives him \"will come\" (John 6:37).", "Spurgeon: \"If God had not chosen me, I should never have chosen Him.\""], "admit": "", "hold": "1 Corinthians 1:29-30.", "goesTo": "", "other": ["Then ask. \"Two people hear the same sermon and receive the same grace. One believes. What made the difference?\"", "Their best replies. \"Faith is an empty hand receiving a gift. A beggar doesn't boast.\" That's fair. Ask why his hand opened and his neighbor's didn't.", "Their best replies. \"Then your God picks for no reason. That's arbitrary.\" Unconditional means the reason isn't in us. It doesn't mean there is no reason. Scripture gives some: his love (Deuteronomy 7:7-8), \"so that no one may boast\" (1 Corinthians 1:29), and to make his mercy known (Romans 9:23). The rest he hasn't told us.", "Their best replies. \"My view puts the difference in the sinner. Yours puts it in God.\" Yes, and that is where Paul puts it: \"It is because of him that you are in Christ Jesus\" (1 Corinthians 1:30).", "Don't say. \"You're taking credit for your salvation.\" Ask the question."]}, {"code": "F6", "section": "Free will", "title": "\"God knows what I'll choose. That doesn't mean he causes it.\"", "triggers": ["God knows what I'll choose. That doesn't mean he causes it.", "He knows what I'll choose. He doesn't cause it.", "God knows what I'll choose. He doesn't cause it."], "oneLiner": "Knowing isn't causing, agreed. But if he knew and made that world anyway, the outcome was settled when he made it.", "sayFirst": "\"Agreed. Knowing isn't causing.\"", "claim": "", "read": "", "theySay": "", "points": ["Romans 8:29 says \"those God foreknew.\" What he foreknew is people. Their faith isn't mentioned. See E1.", "Scripture gives the basis of the choice as \"not by works but by him who calls\" (Romans 9:12). It never gives foreseen faith as the basis.", "If God knew before creation who would refuse him and made that world, the outcome was settled when he made it. Foreknowledge moves the question back a step and leaves it standing.", "If he says God arranged circumstances knowing how each person would respond, that is Molinism. God still picks which world to make, so he still picks who ends up believing."], "admit": "", "hold": "Romans 8:29, then back to E1.", "goesTo": "", "other": []}, {"code": "F7", "section": "Free will", "title": "\"Not everything that happens is God's will. The kingdom is at war.\"", "triggers": ["Not everything that happens is God's will. The kingdom is at war.", "Not everything is God's will.", "Not everything that happens is God's will."], "oneLiner": "His commands get broken every day. His plan doesn't. The cross was both.", "sayFirst": "\"The kingdom has come and isn't finished. Evil is real and God hates it.\" \"The whole world is under the control of the evil one\" (1 John 5:19).", "claim": "", "read": "", "theySay": "", "points": ["\"God's will\" has two senses. His commands are broken every day, and \"your will be done\" is a prayer about those. His plan is never broken. He \"works out everything in conformity with the purpose of his will\" (Ephesians 1:11).", "Satan is on a leash. He needs permission to touch Job (Job 1:12). \"Satan has asked to sift all of you as wheat. But I have prayed for you\" (Luke 22:31-32).", "The enemy's worst attack was God's plan. Had the rulers understood, \"they would not have crucified the Lord of glory\" (1 Corinthians 2:8).", "\"No purpose of yours can be thwarted\" (Job 42:2)."], "admit": "", "hold": "Acts 4:27-28. The worst thing the enemy ever did was the thing God had planned for our rescue.", "goesTo": "", "other": ["Expect this from your Vineyard friend.", "If he says God doesn't know every future choice. Some who hold the warfare view go that far. Then \"your God also made people he knew would be lost\" won't work on him. Ask instead: \"Can God change a heart without ruining it? He stopped Paul on the Damascus road.\" If yes, his God could rescue more people and doesn't. Then read Isaiah 46:10: \"I make known the end from the beginning.\""]}, {"code": "F8", "section": "Free will", "title": "\"Grace can be resisted.\" \"You were not willing.\"", "triggers": ["Grace can be resisted.", "You were not willing."], "oneLiner": "People resist God all the time. When he gives a new heart, the resisting stops.", "sayFirst": "\"People resist God all the time. I agree with every one of those verses.\"", "claim": "", "read": "", "theySay": "", "points": ["There are two calls. The outward call is the gospel preached to everyone, and people refuse it every day. The inward call is God opening a heart, and it always lands. \"Those he called, he also justified\" (Romans 8:30). Everyone called in that sense ends up justified.", "Paul puts both in one sentence. Christ is preached to all, \"a stumbling block to Jews and foolishness to Gentiles, but to those whom God has called ... the power of God\" (1 Corinthians 1:23-24).", "Acts 7:51. \"You always resist the Holy Spirit!\" The next verse says how. Their ancestors persecuted the prophets. They resisted the Spirit speaking through his messengers.", "Matthew 23:37. Grant it. Jesus longed to gather them and they refused. The verse shows what he desired and what they wanted. It doesn't say he set out to change their hearts and failed.", "\"Irresistible\" is a poor word for it. Nobody is dragged. God gives a new heart and the person comes gladly. \"The Lord opened her heart to respond\" (Acts 16:14)."], "admit": "The plain sense of Matthew 23:37 favors them. Your answer depends on the two levels of God's will in E6.", "hold": "Romans 8:30. Ask: \"Is anyone called in that sense and not justified?\"", "goesTo": "", "other": []}, {"code": "F9", "section": "Free will", "title": "\"Faith comes first, then new life.\"", "triggers": ["Faith comes first, then new life.", "by believing you may have life", "to all who did receive him ... he gave the right to become children of God"], "oneLiner": "Faith brings eternal life, yes. I'm asking what opened the heart to believe.", "sayFirst": "\"Agreed. Eternal life comes through faith. I'm asking what opens a heart to believe.\"", "claim": "", "read": "", "theySay": "They'll read \"by believing you may have life\" (John 20:31) and \"to all who did receive him ... he gave the right to become children of God\" (John 1:12).", "points": ["Two things get called \"life.\" Eternal life with God is received by faith, and nobody disputes that. The new birth is God opening the heart, and that is what makes faith possible.", "\"Everyone who believes that Jesus is the Christ is born of God\" (1 John 5:1). John uses the same form in 2:29, \"everyone who does what is right has been born of him,\" where the birth plainly comes first. Don't lean on John 3:3: verse 5 shows \"see\" means enter.", "John 1:12 says believers become God's children. The next verse says where that birth comes from: \"not of ... human decision ... but born of God\" (1:13).", "God \"made us alive with Christ even when we were dead in transgressions\" (Ephesians 2:5). The dead are acted on.", "The Lord opened Lydia's heart, and then she responded (Acts 16:14)."], "admit": "No verse states the order in so many words. It is an inference from texts like these, and John 1:12-13 can be read their way.", "hold": "Acts 16:14, and 1 John 5:1 read with 2:29.", "goesTo": "", "other": []}, {"code": "J1", "section": "Justice", "title": "\"That isn't fair. That's not the God I know.\"", "triggers": ["That isn't fair. That's not the God I know.", "That isn't fair."], "oneLiner": "Nobody gets worse than he deserves. Why mercy isn't given to all, I only partly know (Romans 9:22-23).", "sayFirst": "\"I feel that too.\" It's true of you, so say it because it is.", "claim": "", "read": "", "theySay": "", "points": ["Paul hears this objection and doesn't soften. \"Is God unjust? Not at all!\" (Romans 9:14). \"One of you will say to me: 'Then why does God still blame us?'\" (9:19). Nobody raises that objection against election by foreseen faith.", "Mercy isn't owed. \"I am not being unfair to you ... Don't I have the right to do what I want with my own money? Or are you envious because I am generous?\" (Matthew 20:13-15).", "God's own people have said \"not the God I know\" and been corrected. Peter said, \"Never, Lord! This shall never happen to you!\" and was told he had in mind \"merely human concerns\" (Matthew 16:22-23).", "The question is shared, not the answer. \"Your God also has people he knew would be lost. Your reason is that love can't be forced. Mine is Romans 9:22-23. Neither of us escapes the question.\"", "Our sense of justice is real and unfinished. Lewis compared it to a child's first attempt to draw a wheel. It's a poor circle, and it is still trying to be a circle."], "admit": "\"I don't know why God doesn't change every heart.\"", "hold": "Romans 9:19-20. The objection they are raising is the one Paul expected.", "goesTo": "", "other": ["Two cautions. In John 6:60 the \"hard teaching\" is mainly about eating his flesh. Your ground is 6:64-66. Don't say they left over election alone.", "Two cautions. Don't play \"God's ways are higher\" against every objection. In Isaiah 55 the higher ways are about how freely he pardons."]}, {"code": "J2", "section": "Justice", "title": "\"Then why does God still blame us?\"", "triggers": ["Then why does God still blame us?", "Then why does he blame us?", "Then it isn't fair to judge them"], "oneLiner": "That's Romans 9:19 word for word. People are blamed for what they wanted and did.", "sayFirst": "\"That's Paul's own question, word for word. Romans 9:19.\"", "claim": "", "read": "", "theySay": "", "points": ["Look at what Paul doesn't say. He never says, \"You've misread me, God only foresaw your choice.\" He says, \"But who are you, a human being, to talk back to God?\" (9:20).", "Blame follows the will. People are judged for what they wanted and did. \"People loved darkness instead of light\" (John 3:19).", "Nobody who wants Christ is refused. \"Whoever comes to me I will never drive away\" (John 6:37).", "Scripture shows God ordaining an act and judging the doer. He sends Assyria as \"the rod of my anger,\" then punishes its king for \"the willful pride of his heart\" (Isaiah 10:5-7, 12). The cross was God's \"deliberate plan,\" carried out by \"wicked men\" (Acts 2:23).", "Causing something is different from being to blame for it. Blame belongs to whoever does wrong for a wrong reason."], "admit": "None of this takes God out of the causal story. He is the first cause of a world he knew in full. That is also true of an all-knowing creator on their view.", "hold": "Romans 9:19-20.", "goesTo": "", "other": []}, {"code": "J3", "section": "Justice", "title": "\"Then God is the author of evil.\"", "triggers": ["Then God is the author of evil.", "Was Adam's fall planned?"], "oneLiner": "No. He planned the cross, and the men who did it were still the guilty ones.", "sayFirst": "\"No Calvinist confession says that. Westminster says God ordains what happens and is not the author of sin.\"", "claim": "", "read": "", "theySay": "", "points": ["\"God cannot be tempted by evil, nor does he tempt anyone; but each person is tempted when they are dragged away by their own evil desire\" (James 1:13-14). \"God is light; in him there is no darkness at all\" (1 John 1:5).", "One act can carry two intentions. \"You intended to harm me, but God intended it for good\" (Genesis 50:20).", "First cause and second cause. God holds everything in being, and creatures truly act. This names how it works without explaining it. Don't reach for an author analogy, because an author does write his villain's deeds.", "God made everything good. Evil is damage to something good and has no existence of its own. Augustine said God judged it better to bring good out of evil than to permit no evil at all.", "He didn't stay outside the suffering. He bore it at the cross.", "\"Your God also permits every evil he could stop.\" Their reason is protecting free choice. Yours is that he brings good out of it (Genesis 50:20)."], "admit": "Was Adam's fall inside God's plan? Yes. Did God do the sinning? No. Adam chose it, and he was able not to. Nobody can explain how the first evil desire arose in a creature God made good. Second causes keep creatures real agents. They don't take God out of the chain.", "hold": "Acts 2:23. The worst sin in history was planned by God for good, and the men who did it were guilty.", "goesTo": "", "other": ["If they say Joseph and the cross only show God using evil after the fact. Acts 4:28 says the rulers did what God's will \"had decided beforehand should happen.\" The plan came first."]}, {"code": "J4", "section": "Justice", "title": "\"A loving God wouldn't pass anyone over.\"", "triggers": ["A loving God wouldn't pass anyone over.", "A loving God wouldn't do that."], "oneLiner": "God is love, and his love for every person is real. Why it saves some and not all, I can't fully say.", "sayFirst": "\"God is love. I'm not taking anything away from that.\"", "claim": "", "read": "", "theySay": "", "points": ["Love, justice and goodness are one in God. He doesn't have three qualities competing for a say. He is each of them, whole. The words differ on our side, like one white light spread through a prism. Aquinas taught this, and Westminster implies it.", "So \"a loving God wouldn't\" sets one attribute against another. Scripture gives them together. He is \"compassionate and gracious ... Yet he does not leave the guilty unpunished\" (Exodus 34:6-7).", "The cross is where you can see it. God gave his Son \"so as to be just and the one who justifies those who have faith in Jesus\" (Romans 3:26). Love paid what justice required.", "Mercy goes past justice without breaking it. Aquinas: a man who owes a hundred and pays two hundred has done nothing against justice.", "God loves everyone, and not in the same way. \"Jesus looked at him and loved him\" (Mark 10:21), and the man walked away. He sends sun and rain on the evil and the good (Matthew 5:44-45). \"Christ loved the church and gave himself up for her\" (Ephesians 5:25). Aquinas: God wishes some good to all, and not every good to all.", "As a four-pointer you can say \"Jesus loves you\" and \"Christ died for you\" to anyone.", "\"What does his love do for the ones he passes over?\" It gave his Son for them, offers them life in earnest, and gives them every good thing they have. His kindness \"is intended to lead you to repentance\" (Romans 2:4).", "\"A loving God does everything he can for each person.\" Scripture doesn't say that on either view. Jesus says Tyre and Sidon \"would have repented long ago\" if they had seen his miracles (Matthew 11:21). They weren't shown them."], "admit": "", "hold": "Exodus 34:6-7 and Romans 3:26.", "goesTo": "", "other": ["It cuts back at you. If God's justice is his love, then passing over a sinner has to be an act of love as well. A sharp friend will ask how. You can't show how. Say plainly that God's love for the passed-over is real and not saving: he wills them some good, not every good (Aquinas). \"God is love\" and Romans 9:22-23 are both in Scripture, and you hold both without being able to reconcile them. The doctrine tells you they fit. It doesn't tell you how. Aquinas also says God wills all to be saved only in a qualified way, and decrees absolutely. That is your two levels again, so own the qualification.", "Don't overclaim. Divine simplicity is an inference from texts like \"God is love\" (1 John 4:8) and \"I AM WHO I AM\" (Exodus 3:14). It isn't a verse, and Plantinga rejects it."]}, {"code": "J5", "section": "Justice", "title": "\"So God creates people just to send them to hell?\"", "triggers": ["So God creates people just to send them to hell?", "So he makes people for hell?"], "oneLiner": "No. He chooses among sinners, and the lost are judged for their own sin. Romans 9:22 doesn't say he made them for it.", "sayFirst": "\"No. I don't believe that, and Romans 9 doesn't say it.\"", "claim": "", "read": "", "theySay": "", "points": ["Romans 9:22 says \"prepared for destruction\" and doesn't name who prepared them. Verse 23 names God as the one who prepared the objects of mercy. The two sides aren't mirror images.", "God gives mercy to some sinners and passes over others, leaving them in the sin they chose. He chooses among the guilty.", "Nobody is made to sin against his will, and nobody who wants Christ is turned away.", "The lost get what they insisted on. \"God gave them over\" (Romans 1:24). Lewis said the doors of hell are locked from the inside, and you can agree with half of that.", "\"Your God also has people he knew would be lost. You give a different reason, but you face the same question.\"", "\"Romans 9:18 says he hardens whom he wants.\" It does, and don't dodge it. In Scripture hardening falls on people already in rebellion. Pharaoh hardened his own heart (Exodus 8:15), and God had said beforehand that he would harden it (4:21). Both are true. Hardening is judgment on sin. It never makes an innocent man guilty. Still, admit these texts make it more than passive. The careful form is that God chose among people already viewed as fallen.", "\"He could save them with a word.\" Yes, and you can't fully say why he doesn't. Their answer is that he won't force anyone. Ask how God won Paul on the Damascus road without forcing him, and admit this is your hardest question."], "admit": "Passing over is still a decision. He could have given grace. The furthest Paul goes is a question: \"What if he did this to make the riches of his glory known to the objects of his mercy?\" (9:23).", "hold": "Romans 9:22-23, read exactly as written.", "goesTo": "", "other": []}, {"code": "J6", "section": "Justice", "title": "\"What about people who never heard? You only believe because of where you were born.\"", "triggers": ["What about people who never heard? You only believe because of where you were born.", "What about people who never heard?"], "oneLiner": "That's hard for both of us. If salvation turns on a free response, why did some never hear the name?", "sayFirst": "", "claim": "", "read": "", "theySay": "", "points": ["This presses on both views. Here is how it presses on theirs. If salvation turns on a fair and open chance, why did one man get a Christian home and another never hear the name?", "On your view God appoints the means along with the end, and where you were born is one of the means. He \"marked out their appointed times in history and the boundaries of their lands\" (Acts 17:26).", "\"How can they believe in the one of whom they have not heard?\" (Romans 10:14). That verse is why missionaries go.", "Where you learned something doesn't settle whether it's true."], "admit": "It doesn't make it feel fair.", "hold": "Acts 17:26 and Romans 10:14. Know that they will claim the next verse, 17:27: \"so that they would seek him and perhaps reach out for him.\"", "goesTo": "", "other": []}, {"code": "J7", "section": "Justice", "title": "Hard passages (backup for J1)", "triggers": ["Backup for J1: the hard passages list", "Hard passages (backup for J1)", "That isn't fair. That's not the God I know."], "oneLiner": "", "sayFirst": "", "claim": "", "read": "", "theySay": "", "points": ["Genesis 6-7: The flood takes all but eight people.", "Genesis 22: Abraham is told to offer Isaac.", "Exodus 12:29: Every firstborn in Egypt dies in one night.", "Leviticus 10:1-2: Nadab and Abihu are consumed for unauthorized fire.", "Numbers 15:32-36: A man is put to death for gathering wood on the Sabbath.", "Numbers 16: The ground swallows Korah's rebels and their households.", "Joshua 7: Achan's family dies with him.", "1 Samuel 15:3: Saul is ordered to destroy Amalek completely.", "2 Samuel 6:6-7: Uzzah steadies the ark and is struck dead.", "2 Samuel 12:14-18: David's infant son dies for David's sin.", "2 Samuel 24: Seventy thousand die after David's census.", "1 Kings 22:19-23: God sends a deceiving spirit to Ahab's prophets.", "2 Kings 2:23-24: Bears maul forty-two youths who mocked Elisha.", "Job 1-2, 38-42: Job loses everything and is never told why.", "Mark 4:11-12: Jesus teaches in parables so that some will not perceive.", "Luke 13:1-5: The tower of Siloam. \"Unless you repent, you too will all perish.\"", "John 9:1-3: A man is born blind so that God's works might be displayed.", "Acts 5:1-11: Ananias and Sapphira fall dead for a lie.", "Acts 12:23: Herod is struck down for accepting worship.", "Romans 9:17-18: Pharaoh is raised up so God's power might be shown."], "admit": "", "hold": "", "goesTo": "", "other": ["Use this only when a friend says flatly that the God he knows would never do such a thing. Every Christian at the table already trusts God's justice in places they can't explain. Ask which of these they would have predicted.", "The caution that goes with it. Lewis's point is that our justice is a rough likeness of God's, never its opposite. Don't use this list to say God can do anything and call it good. Use it to say his justice is wider than our first guess."]}, {"code": "J8", "section": "Justice", "title": "When you have no answer left", "triggers": ["You have no answer left", "When you have no answer left"], "oneLiner": "", "sayFirst": "", "claim": "", "read": "", "theySay": "", "points": ["Say it. \"I don't know. Neither of us can fully answer that.\"", "\"The secret things belong to the LORD our God, but the things revealed belong to us\" (Deuteronomy 29:29).", "\"How unsearchable his judgments, and his paths beyond tracing out!\" (Romans 11:33). Paul ends three chapters on election with worship.", "Job never gets his explanation. \"Surely I spoke of things I did not understand\" (Job 42:3).", "The old saints. People who have followed God for sixty years and buried children still die thanking him. That's the child's circle getting closer to the real one. Be honest that you only hear from the ones who stayed, so it's testimony and not proof.", "Your own line: \"It is more important to me that God is real and loving than that I am elected.\"", "Then ask them what God has been doing in their lives."], "admit": "", "hold": "", "goesTo": "", "other": []}, {"code": "J9", "section": "Justice", "title": "\"I didn't choose to be born a sinner.\"", "triggers": ["I didn't choose to be born a sinner.", "a drunk driver chose to drink.", "Nobody chose to be born in Adam."], "oneLiner": "True. You didn't earn being counted righteous in Christ either. Romans 5:19.", "sayFirst": "\"True. You didn't choose it. You also didn't earn being counted righteous in Christ.\"", "claim": "", "read": "", "theySay": "Their point: a drunk driver chose to drink. Nobody chose to be born in Adam. So how is an inability I inherited my fault?", "points": ["One man stands for many, in both directions. \"Just as one trespass resulted in condemnation for all people, so also one righteous act resulted in justification and life for all people\" (Romans 5:18). If it is unjust to fall in Adam without choosing it, it is unjust to be raised in Christ without earning it. The gospel runs on the same principle.", "Everyone adds his own sins to Adam's. \"Death came to all people, because all sinned\" (Romans 5:12). \"People loved darkness instead of light\" (John 3:19).", "Don't use the drunk driver. It fails for the reason they give. Use Romans 5.", "\"Your view has this too. You believe we're born fallen and need grace before we can respond.\" Wesley taught original sin. A classical Arminian answers inability with grace given to everyone, so this lands best on a friend who denies that."], "admit": "This is one of the hardest teachings in Christianity, and it is hard for every tradition that holds original sin.", "hold": "Romans 5:18-19.", "goesTo": "", "other": ["Their best reply. \"Adam's guilt comes without my choice. Christ's righteousness comes only through faith. The two aren't equal.\" Grant the difference. The principle that one can stand for many is still in the text."]}], "questions": [{"q": "Can a person come to Christ before God acts on them?", "note": "If they say yes, read John 6:44. If they say no, you agree that grace comes first, and the only question left is who receives it."}, {"q": "Two people receive the same grace. One believes and one doesn't. What made the difference?", "note": "If it's something in the person, Paul's \"what do you have that you did not receive?\" presses on it. Paul says God chose as he did \"so that no one may boast before him\" (1 Corinthians 1:29). If it's nothing in the person, the difference lies with God. If they say faith is an empty hand that earns nothing, agree, and ask why his hand opened and his neighbor's didn't. 1 Corinthians 4:7 is about gifts in Corinth, so use it as a principle, not a proof text. The sharper form: \"In heaven, what will you say made you different from the neighbor who isn't there?\""}, {"q": "Could God bring anyone to faith without forcing them? If so, why isn't everyone saved on your view?", "note": "Most will say love can't be forced. That is their real reason, so take it seriously, then ask how God changed Paul without forcing him."}, {"q": "God knew before he made them who would refuse him. Why did he make them anyway?", "note": "Their answer is that a world with freely given love is worth it. That's a real answer, so ask to hear their reason, not to score."}, {"q": "If your free choice got you in, can your free choice take you out?", "note": "This is for anyone who holds \"once saved, always saved.\" They'll quote \"no one will snatch them out of my hand\" (John 10:28). If God can keep a believer's faith secure without making it fake, ask why he couldn't give that faith in the first place."}, {"q": "Have you ever thanked God for your faith? What were you thanking him for?", "note": "Paul thanks God for the Thessalonians \"because God chose you as firstfruits to be saved\" (2 Thessalonians 2:13). You don't thank someone else for a choice that was finally yours."}, {"q": "When you pray for your brother to be saved, what are you asking God to do?", "note": "If the answer is \"change his heart,\" that is what you believe. If it's \"give him a chance,\" on their view he already has one."}, {"q": "Did God violate Paul's will on the Damascus road? Was Paul's love for Christ real?", "note": "If God didn't violate it, he can change a heart without making love fake. If he did, he overrides wills when he chooses. Their reply: \"I was not disobedient to the vision from heaven\" (Acts 26:19), so Paul could have refused."}, {"q": "Will you be able to sin in heaven? Will you be free there?", "note": "If they say no and yes, then freedom doesn't require being able to choose otherwise. Their reply: our characters there are fixed by free choices made here. Ask whether that first choice could have gone either way."}], "definitions": [{"term": "Free (unhindered)", "def": "I act on what I want and nobody forces me. I affirm this."}, {"term": "Free (open)", "def": "I could have gone either way with everything the same. I deny this."}, {"term": "Compatibilism", "def": "A choice can be settled ahead of time and still be mine, because I do it willingly."}, {"term": "Natural inability", "def": "I want to and something stops me. A man in chains."}, {"term": "Moral inability", "def": "Nothing stops me except what I want. A man who can't forgive."}, {"term": "Outward call, inward call", "def": "The gospel preached to everyone, and God opening a particular heart."}, {"term": "Prevenient grace", "def": "Their term. Grace given to everyone that makes faith possible without securing it."}, {"term": "Headship", "def": "One man standing for many. Adam for all in him, Christ for all in him."}, {"term": "First and second cause", "def": "God holds everything in being. Creatures truly act within it."}, {"term": "Decree and providence", "def": "The plan and the carrying out. The blueprint and the building."}, {"term": "Two levels of God's will", "def": "What he commands and desires, and what he has decided will happen."}, {"term": "Passing over", "def": "God leaving a sinner in the sin he chose. Use this and never \"created for destruction.\""}, {"term": "Evil as privation", "def": "Evil is damage to a good thing. It has no existence of its own."}, {"term": "Divine simplicity", "def": "God has no parts. His love, justice and goodness are one in him."}, {"term": "Monergism and synergism", "def": "One worker in the new birth, or two working together."}], "closing": {"question": "Why does God give to some what he could give to all?", "lines": ["Every free will entry ends with God deciding who comes to want him.", "Every justice entry then asks why he doesn't decide that for everyone.", "So the last question on your side is: \"Why does God give to some what he could give to all?\"", "We each have a question we can't fully answer. Yours has a stated reason, that love can't be forced. Mine has Romans 9:22-23, his mercy made known. I'd rather leave that with God."]}, "verses": [{"ref": "Ephesians 1:4-5", "text": "He chose us in him before the creation of the world ... in accordance with his pleasure and will", "use": "Chosen before creation, by his will", "codes": ["E1", "E5"], "side": "yours"}, {"ref": "Romans 9:11-12", "text": "before the twins were born or had done anything good or bad ... not by works but by him who calls", "use": "The basis of the choice is the caller", "codes": ["E1", "E4", "F6"], "side": "yours"}, {"ref": "Romans 9:15-16", "text": "It does not, therefore, depend on human desire or effort, but on God's mercy", "use": "Mercy on whom he chooses", "codes": ["E1", "E4"], "side": "yours"}, {"ref": "John 6:37", "text": "All those the Father gives me will come to me ... whoever comes to me I will never drive away", "use": "The giving comes before the coming", "codes": ["E2", "E5", "E7", "F3", "F5", "J2"], "side": "yours"}, {"ref": "John 6:44", "text": "No one can come to me unless the Father who sent me draws them, and I will raise them up at the last day", "use": "The one drawn is the one raised", "codes": ["E3", "E5", "F2"], "side": "yours"}, {"ref": "John 6:65", "text": "No one can come to me unless the Father has enabled them", "use": "Jesus explains unbelief", "codes": ["E3"], "side": "yours"}, {"ref": "John 10:16", "text": "I have other sheep that are not of this sheep pen. I must bring them also.", "use": "His sheep before they hear", "codes": ["E2"], "side": "yours"}, {"ref": "Romans 9:6", "text": "Not all who are descended from Israel are Israel", "use": "Romans 9 is about individuals", "codes": ["E4"], "side": "yours"}, {"ref": "Romans 9:19-20", "text": "Then why does God still blame us? For who is able to resist his will? ... But who are you, a human being, to talk back to God?", "use": "Paul raises the fairness objection himself", "codes": ["E4", "J1", "J2"], "side": "yours"}, {"ref": "Romans 9:22-23", "text": "prepared for destruction ... What if he did this to make the riches of his glory known to the objects of his mercy?", "use": "Why mercy isn't given to all, partly told", "codes": ["E6", "J1", "J5"], "side": "yours"}, {"ref": "Revelation 17:8", "text": "Names have not been written in the book of life from the creation of the world", "use": "The book of names written before creation", "codes": ["E5"], "side": "yours"}, {"ref": "2 Thessalonians 2:13", "text": "God chose you as firstfruits to be saved through the sanctifying work of the Spirit and through belief in the truth", "use": "Chosen to be saved; read it before they do", "codes": ["E5"], "side": "yours"}, {"ref": "Romans 11:33", "text": "How unsearchable his judgments, and his paths beyond tracing out!", "use": "Where Paul ends: worship", "codes": ["E6", "J8"], "side": "yours"}, {"ref": "1 John 2:2", "text": "He is the atoning sacrifice for our sins, and not only for ours but also for the sins of the whole world", "use": "Christ died for all (four-point)", "codes": ["E7"], "side": "yours"}, {"ref": "Acts 4:27-28", "text": "did what your power and will had decided beforehand should happen", "use": "God's plan and guilty human choices", "codes": ["F1", "F7", "J3"], "side": "yours"}, {"ref": "Philippians 2:12-13", "text": "it is God who works in you to will and to act", "use": "God works in the willing itself", "codes": ["F1"], "side": "yours"}, {"ref": "John 5:40", "text": "you refuse to come to me to have life", "use": "They can't because they won't", "codes": ["F2", "F3"], "side": "yours"}, {"ref": "Ezekiel 36:26-27", "text": "I will give you a new heart ... and move you to follow my decrees", "use": "God gives what he commands", "codes": ["F3"], "side": "yours"}, {"ref": "Acts 18:9-10", "text": "Keep on speaking ... because I have many people in this city", "use": "Election is why Paul kept preaching", "codes": ["F4"], "side": "yours"}, {"ref": "1 Corinthians 1:29-30", "text": "so that no one may boast before him ... It is because of him that you are in Christ Jesus", "use": "The difference lies with God", "codes": ["F5"], "side": "yours"}, {"ref": "Romans 8:29", "text": "those God foreknew he also predestined", "use": "Foreknew people, not their faith", "codes": ["E1", "F6"], "side": "yours"}, {"ref": "Romans 8:30", "text": "Those he called, he also justified", "use": "The inward call always lands", "codes": ["F8"], "side": "yours"}, {"ref": "Acts 16:14", "text": "The Lord opened her heart to respond to Paul's message", "use": "God opens the heart, then faith", "codes": ["E3", "F8", "F9"], "side": "yours"}, {"ref": "1 John 5:1", "text": "Everyone who believes that Jesus is the Christ is born of God", "use": "New birth before faith (read with 2:29)", "codes": ["F9"], "side": "yours"}, {"ref": "1 John 2:29", "text": "everyone who does what is right has been born of him", "use": "Same form; the birth plainly comes first", "codes": ["F9"], "side": "yours"}, {"ref": "Acts 2:23", "text": "God's deliberate plan and foreknowledge ... you, with the help of wicked men, put him to death.", "use": "God planned the cross; the men were guilty", "codes": ["E6", "J2", "J3"], "side": "yours"}, {"ref": "Exodus 34:6-7", "text": "compassionate and gracious ... Yet he does not leave the guilty unpunished", "use": "Love and justice given together", "codes": ["J4"], "side": "yours"}, {"ref": "Romans 3:26", "text": "so as to be just and the one who justifies those who have faith in Jesus", "use": "At the cross love paid what justice required", "codes": ["J4"], "side": "yours"}, {"ref": "Acts 17:26", "text": "marked out their appointed times in history and the boundaries of their lands", "use": "Where you were born is one of the means", "codes": ["J6"], "side": "yours"}, {"ref": "Romans 10:14", "text": "How can they believe in the one of whom they have not heard?", "use": "Why missionaries go", "codes": ["J6"], "side": "yours"}, {"ref": "Deuteronomy 29:29", "text": "The secret things belong to the LORD our God, but the things revealed belong to us", "use": "When you have no answer left", "codes": ["J8"], "side": "yours"}, {"ref": "Romans 5:18-19", "text": "Just as one trespass resulted in condemnation for all people, so also one righteous act resulted in justification and life for all people. For just as through the disobedience of the one man the many were made sinners, so also through the obedience of the one man the many will be made righteous.", "use": "One man stands for many, both ways", "codes": ["J9"], "side": "yours"}, {"ref": "1 Timothy 2:3-4", "text": "God our Savior, who wants all people to be saved", "use": "Their strongest: God wants all saved", "codes": ["E6"], "side": "theirs"}, {"ref": "2 Peter 3:9", "text": "not wanting anyone to perish", "use": "God wants none to perish", "codes": ["E6"], "side": "theirs"}, {"ref": "Ezekiel 33:11", "text": "I take no pleasure in the death of the wicked ... Turn! Turn from your evil ways!", "use": "God pleads with the wicked to turn", "codes": ["E6"], "side": "theirs"}, {"ref": "Matthew 23:37", "text": "How often I have longed to gather your children together ... and you were not willing", "use": "Jesus longed; they refused", "codes": ["E6", "F8"], "side": "theirs"}, {"ref": "John 3:16-17", "text": "God so loved the world ... whoever believes in him shall not perish ... to save the world through him", "use": "God loves and sends the Son for the world", "codes": ["E6", "E7"], "side": "theirs"}, {"ref": "Titus 2:11", "text": "that offers salvation to all people", "use": "Grace offered to all", "codes": ["E6", "E3"], "side": "theirs"}, {"ref": "1 Timothy 4:10", "text": "the Savior of all people, and especially of those who believe", "use": "Why not to use the 'all kinds' reply", "codes": ["E6"], "side": "theirs"}, {"ref": "Lamentations 3:33", "text": "he does not willingly bring affliction or grief to anyone", "use": "Judgment is not his delight", "codes": ["E6"], "side": "theirs"}, {"ref": "Deuteronomy 30:19", "text": "I have set before you life and death ... Now choose life", "use": "Commands assume ability", "codes": ["F3"], "side": "theirs"}, {"ref": "Acts 7:51", "text": "You always resist the Holy Spirit!", "use": "Grace can be resisted", "codes": ["F8"], "side": "theirs"}, {"ref": "Luke 7:30", "text": "rejected God's purpose for themselves", "use": "God's purpose refused (hardest one)", "codes": ["F8"], "side": "theirs"}, {"ref": "Ephesians 1:13", "text": "included in Christ when you heard", "use": "Included when they believed", "codes": ["E5"], "side": "theirs"}, {"ref": "Romans 11:22", "text": "you also will be cut off", "use": "Members of the chosen nation cut off", "codes": ["E4", "E5"], "side": "theirs"}]};
