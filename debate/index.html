    if ((e.other || []).some(p => norm(p).includes(w))) s += 1;
    if (!s) return 0;
    total += s;
  }
  return total;
}

function filtered() {
  const q = norm(state.q).trim();
  let list = D.entries.filter(e => state.section === 'All' || e.section === state.section)
    .map(e => [e, scoreEntry(e, q)]).filter(([, s]) => s > 0);
  if (q) list.sort((a, b) => b[1] - a[1]);
  return list.map(([e]) => e);
}

function matchLine(e) {
  const q = norm(state.q).trim();
  if (q) {
    const w = q.split(/\s+/)[0];
    const hit = e.triggers.find(t => norm(t).includes(w));
    if (hit) return hit;
  }
  return e.triggers[0] || e.oneLiner;
}

function renderAnswers(keepFocus) {
  const main = document.getElementById('main');
  if (!document.getElementById('list')) {
    main.innerHTML = `<div class="pane split">
      <aside class="side">
        <div class="searchbox">
          <label class="hint" for="search">Type what your friend just said, a verse, or a code</label>
          <input id="search" type="search" autocomplete="off" placeholder="robots, Esau, 6:44, fair, J9 …">
          <div class="chips" id="chips"></div>
          <span class="hint">Press <kbd>/</kbd> to search, <kbd>↑</kbd><kbd>↓</kbd> to move, <kbd>Esc</kbd> to clear</span>
        </div>
        <div class="list" id="list"></div>
      </aside>
      <section class="detail" id="detail" aria-live="polite"></section>
    </div>`;
    const input = document.getElementById('search');
    input.value = state.q;
    input.addEventListener('input', () => { state.q = input.value; const f = filtered(); if (f.length && !f.includes(byCode[state.code])) state.code = f[0].code; else if (state.q && f.length) state.code = f[0].code; drawList(); drawDetail(); });
    input.addEventListener('keydown', ev => {
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); step(ev.key === 'ArrowDown' ? 1 : -1); }
      if (ev.key === 'Escape') { input.value = ''; state.q = ''; drawList(); }
    });
  }
  const chips = ['All', 'Election', 'Free will', 'Justice'];
  document.getElementById('chips').innerHTML = chips.map(c => `<button class="chip" aria-pressed="${state.section === c}" data-section="${c}">${c}</button>`).join('');
  drawList(); drawDetail();
  if (!keepFocus) document.getElementById('search').focus();
}

function drawList() {
  const list = filtered();
  const el = document.getElementById('list');
  if (!list.length) { el.innerHTML = `<p class="empty">Nothing matches “${esc(state.q)}”. Try one word, like “fair” or “Adam”.</p>`; return; }
  let html = '', last = '';
  for (const e of list) {
    if (!state.q && e.section !== last) { html += `<div class="section-label">${esc(e.section)}</div>`; last = e.section; }
    html += `<button class="item ${sec(e.section)}" data-code="${e.code}" aria-current="${e.code === state.code}">
      <span class="code">${e.code}</span><span class="t">${esc(e.title)}</span><span class="s">${esc(matchLine(e))}</span></button>`;
  }
  el.innerHTML = html;
  const cur = el.querySelector('[aria-current="true"]');
  if (cur) cur.scrollIntoView({ block: 'nearest' });
}

function step(d) {
  const list = filtered(); if (!list.length) return;
  let i = list.findIndex(e => e.code === state.code);
  i = Math.max(0, Math.min(list.length - 1, i + d));
  state.code = list[i].code; save(); drawList(); drawDetail();
}

function blk(label, body) { return body ? `<div class="blk"><span class="lab">${label}</span>${body}</div>` : ''; }

function drawDetail() {
  const e = byCode[state.code] || D.entries[0];
  const el = document.getElementById('detail');
  const pts = e.points.length ? `<ul>${e.points.map(p => `<li>${link(p)}</li>`).join('')}</ul>` : '';
  const other = (e.other || []).map(o => {
    const m = o.match(/^([^.]{2,40})\.\s+(.*)$/s);
    return m ? blk(esc(m[1]), `<p>${link(m[2])}</p>`) : blk('Note', `<p>${link(o)}</p>`);
  }).join('');
  el.innerHTML = `<div class="inner ${sec(e.section)}">
    <div class="eyebrow">${e.code} · ${esc(e.section)}</div>
    <h1>${esc(e.title)}</h1>
    ${e.oneLiner ? `<div class="say"><span class="lab">Say this</span><p>${link(e.oneLiner)}</p></div>` : ''}
    ${e.hold ? `<div class="blk hold"><b>Hold</b><span>${link(e.hold)}</span></div>` : ''}
    ${e.theySay ? blk("They'll say", `<p class="they">${link(e.theySay)}</p>`) : ''}
    ${e.sayFirst && e.sayFirst !== e.oneLiner ? blk('Say first', `<p>${link(e.sayFirst)}</p>`) : ''}
    ${e.claim ? blk('Your claim', `<p>${link(e.claim)}</p>`) : ''}
    ${e.read ? blk('Read', `<p>${link(e.read)}</p>`) : ''}
    ${blk('Your points', pts)}
    ${other}
    ${e.admit ? blk('Admit this', `<p>${link(e.admit)}</p>`) : ''}
    ${e.goesTo ? blk('Where it goes', `<p>${link(e.goesTo)}</p>`) : ''}
  </div>`;
  el.scrollTop = 0;
}

function renderVerses() {
  const main = document.getElementById('main');
  main.innerHTML = `<div class="pane single"><div class="inner">
    <div class="toolbar">
      <input id="vsearch" type="search" placeholder="Search a verse, a word, or a code" autocomplete="off" aria-label="Search verses">
      <div class="chips" id="vchips"></div>
    </div>
    <div class="verses" id="vlist"></div></div></div>`;
  const input = document.getElementById('vsearch');
  input.value = state.vq;
  input.addEventListener('input', () => { state.vq = input.value; drawVerses(); });
  drawVerses(); input.focus();
}
function drawVerses() {
  document.getElementById('vchips').innerHTML = [['all', 'All'], ['yours', 'Yours'], ['theirs', 'Theirs']]
    .map(([k, l]) => `<button class="chip" aria-pressed="${state.vside === k}" data-vside="${k}">${l}</button>`).join('');
  const q = norm(state.vq).trim();
  const vs = D.verses.filter(v => (state.vside === 'all' || v.side === state.vside) &&
    (!q || norm(v.ref + ' ' + v.text + ' ' + v.use + ' ' + v.codes.join(' ')).includes(q)));
  document.getElementById('vlist').innerHTML = vs.length ? vs.map(v => `<article class="verse ${v.side}">
      <div class="r"><b>${esc(v.ref)}</b><span class="side">${v.side === 'theirs' ? 'They read' : 'Yours'}</span></div>
      ${v.text ? `<q>${esc(v.text)}</q>` : ''}
      <span class="u">${esc(v.use)}</span>
      <div class="cs">${v.codes.map(c => byCode[c] ? `<button class="codelink" data-code="${c}">${c}</button>` : '').join('')}</div>
    </article>`).join('') : `<p class="empty">No verse matches “${esc(state.vq)}”.</p>`;
}

function renderQuestions() {
  document.getElementById('main').innerHTML = `<div class="pane single"><div class="inner">
    <p class="hint">Ask these as real questions and let them answer out loud.</p>
    <ol class="qs">${D.questions.map(q => `<li><span class="q">${esc(q.q)}</span>${q.note ? `<span class="n">${link(q.note)}</span>` : ''}</li>`).join('')}</ol>
  </div></div>`;
}

function renderOpening() {
  const o = D.opening;
  document.getElementById('main').innerHTML = `<div class="pane single"><div class="inner">
    <div class="card"><h2>Your opening</h2><p class="lead">${esc(o.firstSentence)}</p>
      <ol>${o.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol></div>
    <div class="card"><h2>The picture</h2><p>${esc(o.picture)}</p>
      ${o.notSaying ? `<p><b>What you're not saying.</b> ${esc(o.notSaying)}</p>` : ''}
      ${o.admit ? `<p><b>What you admit.</b> ${esc(o.admit)}</p>` : ''}
      ${o.whereTheyHit ? `<p><b>Where they will hit it.</b> ${link(o.whereTheyHit)}</p>` : ''}</div>
    <div class="card"><h2>Your position</h2><ol>${D.position.map(p => `<li>${esc(p)}</li>`).join('')}</ol></div>
    <div class="card"><h2>When the talk leaves election</h2><p>${esc(D.exitRule)}</p>
      <p><b>Free will door.</b> ${esc(D.doors.freeWill)}</p><p><b>Justice door.</b> ${esc(D.doors.justice)}</p></div>
    <div class="card closing"><h2>${esc(D.closing.question)}</h2>${D.closing.lines.map(l => `<p>${esc(l)}</p>`).join('')}</div>
  </div></div>`;
}

function renderWords() {
  document.getElementById('main').innerHTML = `<div class="pane single"><div class="inner">
    <p class="hint">Define a term the first time you use it.</p>
    <div style="overflow-x:auto"><table><tr><th>Term</th><th>Say it like this</th></tr>
    ${D.definitions.map(d => `<tr><td>${esc(d.term)}</td><td>${esc(d.def)}</td></tr>`).join('')}</table></div>
  </div></div>`;
}

function renderMap() {
  document.getElementById('main').innerHTML = `<div class="pane single"><div class="inner">
    <p class="hint">Read down the middle. Lines left go to free will, lines right go to justice.</p>
    <div class="mapwrap"><img src="data:image/jpeg;base64,${MAP}" alt="Argument map: election moves E1 to E7, exits to free will F1 to F9 and justice J1 to J9, ending at one closing question"></div>
  </div></div>`;
}

function render(keepFocus) {
  renderTabs();
  ({ answers: renderAnswers, verses: renderVerses, questions: renderQuestions, opening: renderOpening, words: renderWords, map: renderMap }[state.tab] || renderAnswers)(keepFocus);
}

function go(code) { state.tab = 'answers'; state.code = code; state.q = ''; state.section = 'All'; save(); document.getElementById('main').innerHTML = ''; render(true); }

document.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.tab) { state.tab = t.dataset.tab; save(); document.getElementById('main').innerHTML = ''; render(); }
  else if (t.dataset.section) { state.section = t.dataset.section; renderAnswers(true); }
  else if (t.dataset.vside) { state.vside = t.dataset.vside; drawVerses(); }
  else if (t.dataset.code) {
    if (t.classList.contains('item')) { state.code = t.dataset.code; save(); drawList(); drawDetail(); }
    else go(t.dataset.code);
  }
});
document.addEventListener('keydown', ev => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName);
  if (ev.key === '/' && !typing) { ev.preventDefault(); if (state.tab !== 'answers') { state.tab = 'answers'; document.getElementById('main').innerHTML = ''; render(); } else document.getElementById('search').focus(); }
  else if (!typing && /^[1-6]$/.test(ev.key)) { state.tab = TABS[+ev.key - 1][0]; save(); document.getElementById('main').innerHTML = ''; render(); }
  else if (!typing && state.tab === 'answers' && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')) { ev.preventDefault(); step(ev.key === 'ArrowDown' ? 1 : -1); }
});
render();
</script>

</body>
</html>
