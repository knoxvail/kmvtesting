<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="/plate/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plate">
  <title>Plate</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">

    <!-- The one screen. It never scrolls. Everything else slides up over it. -->
    <main id="home" class="screen">
      <header class="top">
        <p class="cap" id="h-date"></p>
        <span class="pair"><button class="link quiet" type="button" data-act="open" data-panel="days">Days</button><button class="link quiet" type="button" data-act="goals">Goals</button></span>
      </header>

      <section class="hero" id="h-hero"></section>

      <section class="meters" aria-label="Today">
        <button class="meter" type="button" data-act="open" data-panel="lift">
          <span class="who"><span class="cap">Lift</span><span class="note" id="m-lift-note"></span></span>
          <span class="num"><b id="m-lift"></b><i id="m-lift-of"></i></span>
          <span class="bar"><i id="m-lift-bar"></i></span>
        </button>
        <button class="meter" type="button" data-act="open" data-panel="food">
          <span class="who"><span class="cap">Food</span><span class="note" id="m-food-note"></span></span>
          <span class="num"><b id="m-food"></b><i id="m-food-of"></i></span>
          <span class="bar"><i id="m-food-bar"></i></span>
        </button>
        <button class="meter" type="button" data-act="sleep">
          <span class="who"><span class="cap">Sleep</span><span class="note" id="m-sleep-note"></span></span>
          <span class="num"><b id="m-sleep"></b><i id="m-sleep-of"></i></span>
          <span class="bar"><i id="m-sleep-bar"></i></span>
        </button>
      </section>

      <section class="week" id="h-week" aria-label="This week"></section>
    </main>

    <!-- Lift: where every lift stands, one day at a time. -->
    <section class="panel" id="p-lift" aria-label="Lift">
      <header class="top">
        <button class="iconbtn" type="button" data-act="close" aria-label="Close"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg></button>
        <p class="cap">Lift</p>
        <span></span>
      </header>
      <div class="tally" id="l-tally"></div>
      <div class="tabs" id="l-tabs"></div>
      <div class="rows" id="l-rows"></div>
      <footer class="foot" id="l-foot"></footer>
    </section>

    <!-- Food: today's protein, the usuals, and what has been eaten. -->
    <section class="panel" id="p-food" aria-label="Food">
      <header class="top">
        <button class="iconbtn" type="button" data-act="close" aria-label="Close"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg></button>
        <p class="cap">Food</p>
        <span></span>
      </header>
      <figure class="plate">
        <svg viewBox="0 0 300 300" class="ring" aria-hidden="true">
          <circle class="track" cx="150" cy="150" r="128" pathLength="100"/>
          <circle class="arcfill" id="f-arc" cx="150" cy="150" r="128" pathLength="100" transform="rotate(-90 150 150)"/>
        </svg>
        <figcaption>
          <b class="big" id="f-big"></b>
          <span class="cap" id="f-of"></span>
        </figcaption>
      </figure>
      <div class="macros" id="f-macros"></div>
      <section class="block">
        <h2 class="cap">Usuals</h2>
        <div class="chips" id="f-usuals"></div>
      </section>
      <section class="block grow">
        <h2 class="cap">Today</h2>
        <div class="rows" id="f-list"></div>
      </section>
    </section>

    <!-- Days: every day you have logged, newest first. -->
    <section class="panel" id="p-days" aria-label="Days">
      <header class="top">
        <button class="iconbtn" type="button" data-act="close" aria-label="Close"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg></button>
        <p class="cap">Days</p>
        <span></span>
      </header>
      <div class="tally" id="d-sum"></div>
      <p class="cap" id="d-cap"></p>
      <div class="rows" id="d-rows"></div>
    </section>

    <!-- One day: what you ate, how you slept, and the workout. All of it can be changed. -->
    <section class="panel" id="p-day" aria-label="Day">
      <header class="top" id="dd-top"></header>
      <div class="rows" id="dd-body"></div>
    </section>

    <!-- Lifting mode. It takes the whole screen. -->
    <section class="panel go" id="p-go" aria-label="Lifting">
      <header class="top" id="g-top"></header>
      <div class="run" id="g-run">
        <div class="g-body">
          <h1 class="liftname" id="g-name"></h1>
          <p class="last" id="g-note"></p>
          <div id="g-load"></div>
          <div id="g-rig"></div>
          <div class="sets" id="g-sets"></div>
          <p class="last" id="g-last"></p>
        </div>
        <div class="rest" id="g-rest"></div>
        <footer class="ctl" id="g-ctl"></footer>
      </div>
      <div class="sum" id="g-sum" hidden></div>
    </section>

    <!-- Always at the bottom: type, talk, or take a photo. -->
    <nav class="dock" id="bar" aria-label="Log something">
      <button class="sq" type="button" data-act="compose" aria-label="Type it">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M8 14h8"/></svg>
      </button>
      <button class="talk" id="mic" type="button" aria-label="Hold to talk">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button class="sq" type="button" data-act="photo" aria-label="Take a photo">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2.5h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
      </button>
    </nav>

    <!-- Typing. The box sits at the top so the keyboard never covers it. -->
    <div class="compose" id="compose" hidden>
      <div class="cbox">
        <form id="dock" autocomplete="off">
          <label class="vh" for="q">Tell it what you did</label>
          <input id="q" name="q" type="text" enterkeyhint="send" autocapitalize="sentences" placeholder="What did you do?">
          <button class="sq on" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
          </button>
        </form>
        <div class="hints" id="c-hints"></div>
      </div>
    </div>

    <input id="cam" type="file" accept="image/*" capture="environment" hidden>
    <input id="restore" type="file" accept="application/json,.json" hidden>

    <div id="say" class="say" role="status" aria-live="polite" hidden></div>
  </div>

  <dialog id="sheet" class="sheet"></dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
