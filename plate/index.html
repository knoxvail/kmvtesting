<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="/plate/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plate">
  <title>Plate</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main id="view"></main>

  <div id="say" class="say" role="status" aria-live="polite" hidden></div>

  <form id="dock" class="dock" autocomplete="off">
    <label class="vh" for="q">Tell it what you did</label>
    <input id="q" name="q" type="text" enterkeyhint="send" autocapitalize="sentences" placeholder="What did you do?">
    <button id="mic" type="button" aria-label="Speak or send">
      <svg class="i-mic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <svg class="i-send" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
    </button>
  </form>

  <dialog id="sheet" class="sheet"></dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
