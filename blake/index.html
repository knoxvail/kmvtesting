<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Blake's List</title>
  <style>
    :root {
      --bg: #FAFAFA;
      --text: #09090B;
      --muted: #52525B;
      --border: #E4E4E7;
      --accent: #2563EB;
      --accent-dark: #1D4ED8;
      --card-bg: #FFFFFF;
      --done: #16A34A;
      --danger: #DC2626;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 18px;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
    }

    main {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 2.5rem 1rem 4rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .sub { color: var(--muted); margin-top: 0.35rem; margin-bottom: 1.75rem; }

    h2 {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 2rem 0 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    h2 .count {
      background: var(--border);
      color: var(--text);
      border-radius: 999px;
      padding: 0 0.55rem;
      font-size: 0.8rem;
      line-height: 1.5;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 0.4rem;
    }

    input[type="text"], textarea {
      width: 100%;
      font: inherit;
      color: var(--text);
      background: #fff;
      border: 1px solid #CBD5E1;
      border-radius: 10px;
      padding: 0.8rem 0.9rem;
      min-height: 52px;
    }

    textarea { min-height: 110px; resize: vertical; }

    input:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible, .drop:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .field + .field { margin-top: 1rem; }

    .drop {
      margin-top: 1rem;
      border: 2px dashed #CBD5E1;
      border-radius: 12px;
      padding: 1.1rem 1rem;
      text-align: center;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }

    .drop:hover, .drop.over { border-color: var(--accent); background: #EFF6FF; color: var(--accent-dark); }

    .drop svg { flex-shrink: 0; }

    .files { list-style: none; margin-top: 0.75rem; display: flex; flex-direction: column; gap: 0.4rem; }

    .files li {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: #F4F4F5;
      border-radius: 8px;
      padding: 0.45rem 0.6rem 0.45rem 0.8rem;
      font-size: 0.95rem;
    }

    .files .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .files .fsize { color: var(--muted); font-size: 0.85rem; }

    .files button {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .files button:hover { background: #E4E4E7; color: var(--danger); }

    .primary {
      margin-top: 1.1rem;
      width: 100%;
      min-height: 56px;
      font: inherit;
      font-weight: 700;
      font-size: 1.05rem;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 150ms ease;
    }

    .primary:hover { background: var(--accent-dark); }
    .primary:disabled { background: #93C5FD; cursor: default; }

    .status {
      margin-top: 0.75rem;
      min-height: 1.5em;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .status.err { color: var(--danger); }
    .status.ok { color: var(--done); }

    .list { list-style: none; display: flex; flex-direction: column; gap: 0.6rem; }

    .item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.9rem 0.9rem 0.9rem 1rem;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.8rem;
      align-items: start;
    }

    .item.saving { opacity: 0.6; }

    .check {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid #A1A1AA;
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
      margin-top: 1px;
      transition: background 150ms ease, border-color 150ms ease;
    }

    .check:hover { border-color: var(--done); }
    .item.done .check { background: var(--done); border-color: var(--done); }

    .body { min-width: 0; }
    .title { font-weight: 600; overflow-wrap: anywhere; }
    .item.done .title { text-decoration: line-through; color: var(--muted); font-weight: 500; }

    .notes {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 0.25rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .meta { margin-top: 0.4rem; font-size: 0.85rem; }
    .meta a { color: var(--accent); text-decoration: none; }
    .meta a:hover { text-decoration: underline; }

    .trash {
      background: none;
      border: none;
      color: #A1A1AA;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: -3px -4px 0 0;
    }

    .trash:hover { background: #FEF2F2; color: var(--danger); }

    .empty {
      color: var(--muted);
      padding: 1.25rem 0.5rem;
      text-align: center;
    }

    footer {
      margin-top: 3rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Blake's List</h1>
    <p class="sub">Anything you put here lands on Knox's list the moment you add it.</p>

    <section class="card" aria-labelledby="add-heading">
      <form id="add-form" novalidate>
        <div class="field">
          <label for="title" id="add-heading">What needs doing?</label>
          <input type="text" id="title" autocomplete="off" placeholder="Call the roofer about the Elm St. bid" maxlength="200" required>
        </div>
        <div class="field">
          <label for="notes">Details <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
          <textarea id="notes" placeholder="Who, where, numbers, anything Knox should know." maxlength="4000"></textarea>
        </div>

        <div class="drop" id="drop" tabindex="0" role="button" aria-label="Add files, photos or documents">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          <span id="drop-text">Drop photos or files here, or tap to choose</span>
          <input type="file" id="file-input" multiple hidden>
        </div>
        <ul class="files" id="file-list"></ul>

        <button type="submit" class="primary" id="add-btn">Add to the list</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <h2>To do <span class="count" id="open-count">0</span></h2>
    <ul class="list" id="open-list"></ul>

    <h2>Done <span class="count" id="done-count">0</span></h2>
    <ul class="list" id="done-list"></ul>

    <footer>Tap the circle when something is finished. The trash can takes it off the list for good.</footer>
  </main>

  <script>
    // The list lives in Knox's Notion. This page talks to the dashboard's API,
    // which holds the Notion token; nothing secret is in this file.
    var LOCAL = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    var API = LOCAL ? 'http://localhost:3000/api/blake' : 'https://knox-dashboard-pnsj.vercel.app/api/blake';
    var MAX_BYTES = 4 * 1024 * 1024;

    var items = [];
    var queued = []; // files waiting to go with the next item

    var $ = function (id) { return document.getElementById(id); };
    var openList = $('open-list'), doneList = $('done-list');
    var statusEl = $('status');

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function setStatus(msg, kind) {
      statusEl.textContent = msg || '';
      statusEl.className = 'status' + (kind ? ' ' + kind : '');
    }

    function fmtSize(n) {
      if (n < 1024) return n + ' B';
      if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
      return (n / (1024 * 1024)).toFixed(1) + ' MB';
    }

    // ---------- rendering ----------
    var CHECK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>';
    var TRASH = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';

    function itemHtml(it) {
      var label = it.done ? 'Put back on the list' : 'Mark as done';
      return '<li class="item' + (it.done ? ' done' : '') + (it.saving ? ' saving' : '') + '" data-id="' + esc(it.id) + '">' +
        '<button class="check" type="button" data-act="toggle" aria-label="' + label + '" aria-pressed="' + (it.done ? 'true' : 'false') + '">' + (it.done ? CHECK : '') + '</button>' +
        '<div class="body">' +
          '<div class="title">' + esc(it.title) + '</div>' +
          (it.notes ? '<div class="notes">' + esc(it.notes) + '</div>' : '') +
          '<div class="meta">' + (it.saving ? esc(it.saving) : (it.url ? '<a href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">Open in Notion</a>' : '')) + '</div>' +
        '</div>' +
        '<button class="trash" type="button" data-act="remove" aria-label="Remove from the list"' + (it.saving ? ' disabled' : '') + '>' + TRASH + '</button>' +
      '</li>';
    }

    function render() {
      var open = items.filter(function (i) { return !i.done; });
      var done = items.filter(function (i) { return i.done; });
      // newest first so what he just added is on top
      open.reverse(); done.reverse();
      openList.innerHTML = open.length ? open.map(itemHtml).join('') : '<li class="empty">Nothing on the list right now.</li>';
      doneList.innerHTML = done.length ? done.map(itemHtml).join('') : '<li class="empty">Nothing finished yet.</li>';
      $('open-count').textContent = open.length;
      $('done-count').textContent = done.length;
    }

    function renderQueue() {
      $('file-list').innerHTML = queued.map(function (f, i) {
        return '<li><span class="fname">' + esc(f.name) + '</span><span class="fsize">' + fmtSize(f.size) + '</span>' +
          '<button type="button" data-unqueue="' + i + '" aria-label="Remove ' + esc(f.name) + '">' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></li>';
      }).join('');
      $('drop-text').textContent = queued.length ? 'Add more files' : 'Drop photos or files here, or tap to choose';
    }

    // ---------- API ----------
    function api(body) {
      return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; }); });
    }

    var loading = false;
    function load() {
      if (loading) return;
      loading = true;
      fetch(API, { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (j) {
          // keep anything still mid-save on screen
          var saving = items.filter(function (i) { return i.saving; });
          items = (j.items || []).concat(saving);
          render();
        })
        .catch(function () { setStatus("Couldn't reach the list. Check the connection and try again.", 'err'); })
        .then(function () { loading = false; });
    }

    // Phone photos run 3 to 8 MB; the API takes 4. Shrink big images in the
    // browser before sending so they go through without anyone thinking about it.
    function shrinkImage(file) {
      return new Promise(function (resolve) {
        if (!/^image\//.test(file.type) || file.size <= 1.5 * 1024 * 1024) return resolve(file);
        var img = new Image();
        var url = URL.createObjectURL(file);
        img.onload = function () {
          try {
            var max = 2000;
            var scale = Math.min(1, max / Math.max(img.width, img.height));
            var c = document.createElement('canvas');
            c.width = Math.round(img.width * scale);
            c.height = Math.round(img.height * scale);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            c.toBlob(function (blob) {
              URL.revokeObjectURL(url);
              if (!blob) return resolve(file);
              var name = file.name.replace(/\.[^.]+$/, '') + '.jpg';
              resolve(new File([blob], name, { type: 'image/jpeg' }));
            }, 'image/jpeg', 0.85);
          } catch (e) { URL.revokeObjectURL(url); resolve(file); }
        };
        img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
        img.src = url;
      });
    }

    function upload(pageId, file) {
      return shrinkImage(file).then(function (f) {
        if (f.size > MAX_BYTES) throw new Error(f.name + ' is over 4 MB. Text or email that one to Knox.');
        var fd = new FormData();
        fd.append('pageId', pageId);
        fd.append('file', f, f.name);
        return fetch(API + '/upload', { method: 'POST', body: fd }).then(function (r) {
          if (!r.ok) return r.json().then(function (j) { throw new Error(j.error === 'too large' ? f.name + ' is too big to send.' : "Couldn't attach " + f.name + '.'); });
        });
      });
    }

    // ---------- add ----------
    $('add-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var title = $('title').value.trim();
      var notes = $('notes').value.trim();
      if (!title) { setStatus('Type what needs doing first.', 'err'); $('title').focus(); return; }

      var files = queued.slice();
      queued = []; renderQueue();
      $('title').value = ''; $('notes').value = '';
      $('add-btn').disabled = true;
      setStatus('Saving…');

      var temp = { id: 'temp-' + Date.now(), title: title, notes: notes, done: false, saving: 'Saving…' };
      items.push(temp); render();

      api({ action: 'add', title: title, notes: notes })
        .then(function (j) {
          var real = j.item;
          var idx = items.indexOf(temp);
          if (idx >= 0) items[idx] = Object.assign({}, real, { saving: files.length ? 'Attaching files…' : '' });
          render();
          var chain = Promise.resolve();
          var failed = [];
          files.forEach(function (f, n) {
            chain = chain.then(function () {
              var cur = items.filter(function (i) { return i.id === real.id; })[0];
              if (cur) { cur.saving = 'Attaching ' + (n + 1) + ' of ' + files.length + '…'; render(); }
              return upload(real.id, f).catch(function (err) { failed.push(err.message); });
            });
          });
          return chain.then(function () {
            var cur = items.filter(function (i) { return i.id === real.id; })[0];
            if (cur) { cur.saving = ''; render(); }
            if (failed.length) setStatus('Added, but ' + failed.join(' '), 'err');
            else setStatus(files.length ? 'Added with ' + files.length + (files.length === 1 ? ' file.' : ' files.') : 'Added.', 'ok');
          });
        })
        .catch(function () {
          items = items.filter(function (i) { return i !== temp; }); render();
          $('title').value = title; $('notes').value = notes; queued = files; renderQueue();
          setStatus("That didn't save. Check the connection and tap Add again.", 'err');
        })
        .then(function () { $('add-btn').disabled = false; });
    });

    // ---------- files ----------
    var drop = $('drop'), fileInput = $('file-input');
    drop.addEventListener('click', function () { fileInput.click(); });
    drop.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
    fileInput.addEventListener('change', function () { addFiles(fileInput.files); fileInput.value = ''; });
    ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
    ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
    drop.addEventListener('drop', function (e) { addFiles(e.dataTransfer.files); });

    function addFiles(list) {
      var tooBig = [];
      Array.prototype.forEach.call(list, function (f) {
        if (f.size > 25 * 1024 * 1024) { tooBig.push(f.name); return; }
        queued.push(f);
      });
      renderQueue();
      if (tooBig.length) setStatus(tooBig.join(', ') + ' is too big to send from here.', 'err');
      else setStatus('');
    }

    $('file-list').addEventListener('click', function (e) {
      var b = e.target.closest('[data-unqueue]');
      if (!b) return;
      queued.splice(Number(b.getAttribute('data-unqueue')), 1);
      renderQueue();
    });

    // ---------- toggle / remove ----------
    function onListClick(e) {
      var btn = e.target.closest('button[data-act]');
      if (!btn) return;
      var li = btn.closest('.item');
      var id = li.getAttribute('data-id');
      var it = items.filter(function (i) { return i.id === id; })[0];
      if (!it || it.saving) return;

      if (btn.getAttribute('data-act') === 'toggle') {
        var was = it.done;
        it.done = !was; render();
        api({ action: 'toggle', id: id, done: it.done }).catch(function () {
          it.done = was; render();
          setStatus("Couldn't save that change. Try again.", 'err');
        });
      }

      if (btn.getAttribute('data-act') === 'remove') {
        if (!confirm('Take "' + it.title + '" off the list for good?')) return;
        var keep = items.slice();
        items = items.filter(function (i) { return i.id !== id; }); render();
        api({ action: 'remove', id: id }).catch(function () {
          items = keep; render();
          setStatus("Couldn't remove that. Try again.", 'err');
        });
      }
    }
    openList.addEventListener('click', onListClick);
    doneList.addEventListener('click', onListClick);

    // ---------- keep fresh ----------
    load();
    setInterval(load, 90000);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') load(); });
  </script>
</body>
</html>
