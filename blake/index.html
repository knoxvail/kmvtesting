<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Blake's List</title>
  <style>
    :root {
      --bg: #F2F2F7;
      --card: #FFFFFF;
      --text: #111113;
      --muted: #6B6B73;
      --line: #E5E5EA;
      --blue: #2563EB;
      --blue-bg: #EEF4FF;
      --green: #16A34A;
      --green-bg: #EFFBF3;
      --amber: #C2410C;
      --amber-bg: #FFF1E6;
      --red: #DC2626;
      --radius: 14px;
      --bar: 88px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
      line-height: 1.45;
      min-height: 100vh;
      padding-bottom: calc(var(--bar) + 32px + env(safe-area-inset-bottom));
    }

    .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }

    /* ---------- top ---------- */
    header.top {
      position: sticky;
      top: 0;
      z-index: 5;
      background: rgba(242, 242, 247, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    header.top .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 16px 10px;
    }

    h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }

    .files-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 40px;
      padding: 0 14px 0 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 150ms ease, color 150ms ease;
    }

    .files-btn:hover { background: #FAFAFA; }
    .files-btn[hidden] { display: none; }
    .files-btn.fresh { background: var(--blue); border-color: var(--blue); color: #fff; }
    .files-btn.fresh:hover { background: #1D4ED8; }
    .files-btn.fresh .pill.count { background: rgba(255, 255, 255, 0.28); color: #fff; }

    /* something new landed on the shelf */
    .banner {
      margin-top: 18px;
      background: var(--blue);
      color: #fff;
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.28);
    }

    .banner[hidden] { display: none; }
    .banner .txt { flex: 1; font-weight: 700; line-height: 1.3; }
    .banner .txt small { display: block; font-weight: 400; opacity: 0.9; font-size: 14px; margin-top: 2px; }

    .banner button {
      background: #fff;
      color: var(--blue);
      border: none;
      border-radius: 10px;
      font: inherit;
      font-weight: 700;
      font-size: 15px;
      min-height: 44px;
      padding: 0 16px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ---------- sections ---------- */
    section { margin-top: 22px; }

    section h2 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 4px 8px;
    }

    .pill { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 8px; line-height: 1.6; }
    .pill.count { background: var(--line); color: var(--text); }
    .pill.new { background: var(--blue); color: #fff; }

    ul.group {
      list-style: none;
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    ul.group li + li { border-top: 1px solid var(--line); }

    .row {
      width: 100%;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 13px 14px 13px 16px;
      min-height: 66px;
      background: none;
      border: none;
      font: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .row:hover { background: #FAFAFA; }
    .row:focus-visible { outline: 3px solid var(--blue); outline-offset: -3px; }

    .mark {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 800;
      font-size: 15px;
    }

    .mark.open { border: 2px solid #C7C7CC; background: #fff; }
    .mark.needs { background: var(--amber-bg); color: var(--amber); border: 2px solid #F3C9A6; }
    .mark.done { background: var(--green); color: #fff; }

    .body { min-width: 0; }

    .title {
      font-weight: 600;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .sub {
      color: var(--muted);
      font-size: 14.5px;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sub b { font-weight: 600; color: var(--green); }
    .sub.amber b { color: var(--amber); }
    .sub.blue b { color: var(--blue); }

    .right { display: flex; align-items: center; gap: 10px; color: #C7C7CC; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); }

    .empty { color: var(--muted); padding: 18px 16px; text-align: center; font-size: 15px; }

    /* ---------- quick add bar ---------- */
    .quick {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    }

    .quick .wrap { padding: 0; }

    .collapsed {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 60px;
      background: #F2F2F7;
      border: none;
      border-radius: 999px;
      padding: 8px 16px 8px 8px;
      font: inherit;
      font-size: 17px;
      color: var(--muted);
      cursor: text;
      text-align: left;
    }

    .collapsed:hover { background: #ECECF1; }

    .plus {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .quick form { display: none; flex-direction: column; gap: 10px; }
    .quick.open .collapsed { display: none; }
    .quick.open form { display: flex; }

    .quick input[type="text"], .quick textarea, .sheet textarea {
      width: 100%;
      font: inherit;
      font-size: 17px;
      color: var(--text);
      border: 1px solid #D1D1D6;
      border-radius: 12px;
      padding: 12px 14px;
      min-height: 50px;
      background: #fff;
    }

    .quick textarea, .sheet textarea { min-height: 84px; resize: vertical; }
    .quick input.linkrow { display: none; font-size: 15px; min-height: 46px; }
    .quick input.linkrow.show { display: block; }

    input:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 2px;
    }

    .qrow { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }

    .ghost {
      background: none;
      border: none;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      color: var(--blue);
      cursor: pointer;
      padding: 0 10px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 10px;
    }

    .ghost:hover { background: var(--blue-bg); }
    .ghost.quiet { color: var(--muted); }

    .send {
      margin-left: auto;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 12px;
      font: inherit;
      font-weight: 700;
      font-size: 16px;
      padding: 0 18px;
      min-height: 46px;
      cursor: pointer;
    }

    .send:hover { background: #1D4ED8; }
    .send:disabled { opacity: 0.5; cursor: default; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      background: #F2F2F7;
      border: none;
      border-radius: 999px;
      padding: 6px 8px 6px 12px;
      font: inherit;
      font-size: 14px;
      color: var(--text);
      cursor: pointer;
    }

    .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip .x { display: flex; color: var(--muted); }

    .status { font-size: 14px; color: var(--muted); min-height: 1.3em; }
    .status.err { color: var(--red); }
    .status.ok { color: var(--green); }

    /* ---------- whole-page drop ---------- */
    .drop-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(37, 99, 235, 0.16);
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .drop-overlay.show { display: flex; }

    .drop-overlay .dz {
      background: #fff;
      border: 3px dashed var(--blue);
      border-radius: 18px;
      padding: 26px 34px;
      font-size: 22px;
      font-weight: 800;
      color: var(--blue);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.18);
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 90vw;
      text-align: center;
    }

    /* ---------- sheet ---------- */
    .scrim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.38);
      z-index: 30;
      display: none;
    }

    .scrim.show { display: block; }

    .sheet {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(680px, 100%);
      max-height: 92vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 18px 18px 0 0;
      z-index: 31;
      display: none;
      padding: 8px 20px calc(28px + env(safe-area-inset-bottom));
      box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.18);
    }

    @media (min-width: 720px) {
      .sheet {
        bottom: auto;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 18px;
        max-height: 86vh;
        padding-bottom: 28px;
      }
    }

    .sheet.show { display: block; }
    .grab { width: 40px; height: 5px; background: #D1D1D6; border-radius: 3px; margin: 6px auto 14px; }

    .sheet .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .sheet h3 { font-size: 22px; font-weight: 800; line-height: 1.25; letter-spacing: -0.01em; overflow-wrap: anywhere; }

    .close {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #F2F2F7;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 999px;
      padding: 3px 10px;
      margin-top: 10px;
    }

    .badge.done { background: var(--green-bg); color: var(--green); }
    .badge.needs { background: var(--amber-bg); color: var(--amber); }
    .badge.open { background: var(--blue-bg); color: var(--blue); }

    .meta { color: var(--muted); font-size: 14px; margin-top: 8px; }

    .block { margin-top: 20px; }

    .block h4 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .desc { white-space: pre-wrap; overflow-wrap: anywhere; }

    .answer { background: var(--green-bg); border-radius: 12px; padding: 12px 14px; }
    .answer.none { background: #F2F2F7; color: var(--muted); }

    .fgrid {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .fcard {
      position: relative;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      background: #F2F2F7;
      border: 1px solid var(--line);
    }

    .fcard .open {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--text);
      font: inherit;
      text-decoration: none;
    }

    .fcard img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .fcard .fn {
      font-size: 12px;
      padding: 0 6px;
      text-align: center;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow-wrap: anywhere;
    }

    .fcard .xbtn {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.94);
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
    }

    .frows { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .frows li { display: flex; align-items: center; gap: 6px; }

    .frows a {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      min-height: 50px;
      min-width: 0;
    }

    .frows a:hover { background: #FAFAFA; }
    .frows a span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .frows a small { color: var(--blue); font-weight: 600; font-size: 14px; }
    .frows li.fresh a { border-color: var(--blue); background: var(--blue-bg); }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; align-items: center; }

    .btn {
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      min-height: 48px;
      padding: 0 16px;
      border-radius: 12px;
      border: 1px solid #D1D1D6;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover { background: #F7F7F9; }
    .btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
    .btn.primary:hover { background: #15803D; }
    .btn.danger { color: var(--red); margin-left: auto; }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .sheet .status { margin-top: 10px; }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.93);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 1rem;
      cursor: zoom-out;
    }

    .lightbox.show { display: flex; }
    .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }

    .lightbox .cap {
      position: absolute;
      bottom: 1.25rem;
      left: 0;
      right: 0;
      text-align: center;
      color: #fff;
      font-size: 0.9rem;
      padding: 0 1rem;
    }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1>Blake's List</h1>
      <button type="button" class="files-btn" id="files-btn" hidden aria-label="Files from Knox">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        <span id="files-label">Files from Knox</span> <span class="pill count" id="files-count">0</span>
      </button>
    </div>
  </header>

  <main class="wrap">
    <div class="banner" id="shelf-banner" hidden role="status">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      <span class="txt" id="banner-text"></span>
      <button type="button" id="banner-btn">See them</button>
    </div>

    <section id="sec-needs">
      <h2>Needs you <span class="pill count" id="needs-count">0</span><span class="pill new" id="needs-new" hidden></span></h2>
      <ul class="group" id="list-needs"></ul>
    </section>

    <section id="sec-waiting">
      <h2>Waiting on Knox <span class="pill count" id="waiting-count">0</span></h2>
      <ul class="group" id="list-waiting"></ul>
    </section>

    <section id="sec-done">
      <h2>Completed <span class="pill count" id="done-count">0</span><span class="pill new" id="done-new" hidden></span></h2>
      <ul class="group" id="list-done"></ul>
    </section>
  </main>

  <!-- quick add, pinned to the bottom like a message bar -->
  <div class="quick" id="quick">
    <div class="wrap">
      <button type="button" class="collapsed" id="quick-open">
        <span class="plus" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
        Ask Knox for something
      </button>
      <form id="add-form" novalidate>
        <input type="text" id="title" autocomplete="off" placeholder="What do you need from Knox?" maxlength="200" aria-label="What do you need from Knox?">
        <textarea id="notes" hidden placeholder="Details: who, where, numbers, anything Knox should know." maxlength="4000" aria-label="Details"></textarea>
        <input type="text" id="link-input" class="linkrow" autocomplete="off" placeholder="Paste a link and press Enter" aria-label="Add a link">
        <div class="chips" id="file-list"></div>
        <div class="qrow">
          <button type="button" class="ghost" id="toggle-notes">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
            Add details
          </button>
          <button type="button" class="ghost" id="pick-files">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            Add files
          </button>
          <button type="button" class="ghost" id="toggle-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            Add link
          </button>
          <input type="file" id="file-input" multiple hidden>
          <button type="button" class="ghost quiet" id="quick-cancel">Cancel</button>
          <button type="submit" class="send" id="add-btn">Send</button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <div class="drop-overlay" id="drop-overlay" aria-hidden="true">
    <div class="dz">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg>
      <span id="drop-text">Drop to send to Knox</span>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>

  <div class="lightbox" id="lightbox" role="dialog" aria-label="Photo, tap anywhere to close">
    <img id="lightbox-img" alt="">
    <div class="cap" id="lightbox-cap"></div>
  </div>

  <script type="module">
    // files go straight from this page to Knox's Vercel Blob store; the
    // dashboard only hands out a short-lived upload token and records the link
    import { upload } from 'https://esm.sh/@vercel/blob@2.8.2/client';
    window.blobUpload = upload;
  </script>

  <script>
    // The list lives in Knox's Notion. This page talks to the dashboard's API,
    // which holds the Notion token; nothing secret is in this file.
    var LOCAL = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    var PROD_API = 'https://knox-dashboard-pnsj.vercel.app/api/blake';
    var API = (LOCAL && new URLSearchParams(location.search).get('api') !== 'prod') ? 'http://localhost:3000/api/blake' : PROD_API;
    var MAX_BYTES = 500 * 1024 * 1024;

    var items = [];         // asks from both sides, each with files (asker's) and responseFiles (answer)
    var files = [];         // the loose shelf from Knox
    var queued = [];        // files and links waiting to go with the next ask
    var sheetItem = null;   // the ask open in the sheet, or 'files' for the shelf
    var sheetQueue = [];    // files and links waiting to go with an answer in the sheet
    var seen = {};          // id -> edited stamp Blake has already looked at
    var seenShelf = {};     // shelf file id -> true once he has opened the shelf
    var justActed = {};     // ids Blake changed himself; refreshes mark them seen for a while
    try { seen = JSON.parse(localStorage.getItem('blake-seen') || '{}'); } catch (e) {}
    try { seenShelf = JSON.parse(localStorage.getItem('blake-seen-shelf') || '{}'); } catch (e) {}

    var $ = function (id) { return document.getElementById(id); };

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function setStatus(msg, kind) {
      var el = $('status');
      el.textContent = msg || '';
      el.className = 'status' + (kind ? ' ' + kind : '');
    }

    function rel(iso) {
      var t = new Date(iso).getTime();
      if (isNaN(t)) return '';
      var m = Math.round((Date.now() - t) / 60000);
      if (m < 1) return 'just now';
      if (m < 60) return m + 'm ago';
      var h = Math.round(m / 60);
      if (h < 24) return h + 'h ago';
      var d = Math.round(h / 24);
      if (d < 7) return d + 'd ago';
      return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    function byId(id) { return items.filter(function (i) { return i.id === id; })[0]; }
    function kindOf(it) { return it.done ? 'done' : (it.side === 'K' ? 'needs' : 'waiting'); }
    function stamp(it) { return it.edited || it.created || ''; }
    function isNew(it) {
      if (kindOf(it) === 'waiting') return false;
      return !seen[it.id] || seen[it.id] < stamp(it);
    }
    function markSeen(it) {
      seen[it.id] = stamp(it) || new Date().toISOString();
      try { localStorage.setItem('blake-seen', JSON.stringify(seen)); } catch (e) {}
    }
    function newShelf() { return files.filter(function (f) { return !seenShelf[f.id]; }); }
    function markShelfSeen() {
      files.forEach(function (f) { seenShelf[f.id] = true; });
      try { localStorage.setItem('blake-seen-shelf', JSON.stringify(seenShelf)); } catch (e) {}
    }

    // queue entries are Files or {link}
    function isLink(p) { return !(p instanceof File); }
    function pendingName(p) { return isLink(p) ? p.link.replace(/^https?:\/\//, '') : p.name; }
    function nitems(n) { return n + (n === 1 ? ' attachment' : ' attachments'); }

    // ---------- rendering ----------
    var CHECK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>';
    var CHEV = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
    var CLIP = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>';
    var X_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>';
    var FILE_ICON = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M14 2v6h6"/></svg>';
    var FILE_SM = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M14 2v6h6"/></svg>';
    var LINK_SM = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';
    var TRASH = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
    var DETAILS_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>';

    function nfiles(n) { return n + (n === 1 ? ' file' : ' files'); }
    function nlinks(n) { return n + (n === 1 ? ' link' : ' links'); }

    // "2 files · 1 link", or '' when there is nothing attached
    function attachLabel(list) {
      if (!list || !list.length) return '';
      var links = list.filter(function (f) { return f.kind === 'link'; }).length;
      var docs = list.length - links;
      var parts = [];
      if (docs) parts.push(nfiles(docs));
      if (links) parts.push(nlinks(links));
      return parts.join(' · ');
    }

    // the one gray line under a title: the state, in words
    function subline(it) {
      var k = kindOf(it);
      var att = (it.files && it.files.length) ? ' · ' + attachLabel(it.files) : '';
      if (k === 'needs') return { cls: 'amber', html: '<b>Knox asked</b> · ' + esc(rel(it.created)) + att };
      if (k === 'waiting') return { cls: 'blue', html: '<b>Waiting</b> · sent ' + esc(rel(it.created)) + att };
      var who = it.side === 'K' ? 'You' : 'Knox';
      var txt = (it.response || '').trim();
      var rf = it.responseFiles ? it.responseFiles.length : 0;
      // a bare check on his own ask could be either of them, so no name on it
      if (!txt && !rf) return { cls: '', html: it.side === 'K' ? '<b>You:</b> checked it off' : '<b>Done</b> · checked off' };
      var what = txt ? esc(txt) : 'sent ' + attachLabel(it.responseFiles);
      return { cls: '', html: '<b>' + who + ':</b> ' + what + (txt && rf ? ' · ' + attachLabel(it.responseFiles) : '') };
    }

    function rowHtml(it) {
      var k = kindOf(it);
      var mark = k === 'done' ? '<span class="mark done" aria-hidden="true">' + CHECK + '</span>'
        : k === 'needs' ? '<span class="mark needs" aria-hidden="true">K</span>'
        : '<span class="mark open" aria-hidden="true"></span>';
      var sub = subline(it);
      var fresh = isNew(it);
      return '<li><button type="button" class="row" data-open="' + esc(it.id) + '" aria-label="' + esc(it.title) + (fresh ? ', new' : '') + '">' +
        mark +
        '<span class="body"><span class="title">' + esc(it.title) + '</span><span class="sub ' + sub.cls + '">' + sub.html + '</span></span>' +
        '<span class="right">' + (fresh ? '<span class="dot" aria-hidden="true"></span>' : '') + (it.saving ? '' : CHEV) + '</span>' +
      '</button></li>';
    }

    function updateTitle() {
      var n = items.filter(function (i) { return kindOf(i) !== 'waiting' && isNew(i); }).length + newShelf().length;
      document.title = (n ? '(' + n + ') ' : '') + "Blake's List";
    }

    function render() {
      var needs = items.filter(function (i) { return kindOf(i) === 'needs'; }).sort(function (a, b) { return (b.created || '').localeCompare(a.created || ''); });
      var waiting = items.filter(function (i) { return kindOf(i) === 'waiting'; }).sort(function (a, b) { return (b.created || '').localeCompare(a.created || ''); });
      var done = items.filter(function (i) { return kindOf(i) === 'done'; }).sort(function (a, b) { return stamp(b).localeCompare(stamp(a)); });

      $('list-needs').innerHTML = needs.length ? needs.map(rowHtml).join('') : '<li class="empty">Nothing from Knox right now.</li>';
      $('list-waiting').innerHTML = waiting.length ? waiting.map(rowHtml).join('') : '<li class="empty">Nothing waiting. Use the blue + below to ask for something, or drop a file anywhere on the page.</li>';
      $('list-done').innerHTML = done.length ? done.map(rowHtml).join('') : '<li class="empty">Nothing finished yet.</li>';

      $('needs-count').textContent = needs.length;
      $('waiting-count').textContent = waiting.length;
      $('done-count').textContent = done.length;
      var nn = needs.filter(isNew).length, dn = done.filter(isNew).length;
      $('needs-new').hidden = !nn; $('needs-new').textContent = nn + ' new';
      $('done-new').hidden = !dn; $('done-new').textContent = dn + ' new';
      updateTitle();
    }

    // the shelf pill and the banner: loud when Knox dropped something he has not seen
    function renderFiles() {
      var fresh = newShelf();
      var btn = $('files-btn');
      btn.hidden = files.length === 0;
      btn.classList.toggle('fresh', fresh.length > 0);
      $('files-label').textContent = fresh.length ? 'New from Knox' : 'Files from Knox';
      $('files-count').textContent = fresh.length ? fresh.length + ' new' : files.length;
      var banner = $('shelf-banner');
      banner.hidden = fresh.length === 0;
      if (fresh.length) {
        $('banner-text').innerHTML = 'Knox dropped ' + esc(attachLabel(fresh)) + ' for you' +
          '<small>' + esc(fresh.slice(0, 3).map(function (f) { return f.name; }).join(', ')) + (fresh.length > 3 ? ', …' : '') + '</small>';
      }
      if (sheetItem === 'files') renderSheet();
      updateTitle();
    }

    function renderQueue() {
      $('file-list').innerHTML = queued.map(function (p, i) {
        return '<button type="button" class="chip" data-unqueue="' + i + '" aria-label="Remove ' + esc(pendingName(p)) + '">' + (isLink(p) ? LINK_SM : CLIP) + '<span>' + esc(pendingName(p)) + '</span><span class="x">' + X_ICON + '</span></button>';
      }).join('');
    }

    // ---------- the sheet ----------
    function fileCardHtml(f, removable) {
      var inner = f.kind === 'image'
        ? '<button type="button" class="open" data-lb-src="' + esc(f.url) + '" data-lb-cap="' + esc(f.name) + '" aria-label="View ' + esc(f.name) + '"><img src="' + esc(f.url) + '" alt="' + esc(f.name) + '" loading="lazy"></button>'
        : '<a class="open" href="' + esc(f.url) + '" target="_blank" rel="noopener noreferrer" aria-label="Open ' + esc(f.name) + '">' + FILE_ICON + '<span class="fn">' + esc(f.name) + '</span></a>';
      return '<li class="fcard" title="' + esc(f.name) + '">' + inner +
        (removable ? '<button type="button" class="xbtn" data-rm-file="' + esc(f.id) + '" aria-label="Remove ' + esc(f.name) + '">' + X_ICON + '</button></li>' : '</li>');
    }

    // photos as a thumbnail grid, files and links as tappable rows
    function filesHtml(list, removable, freshIds) {
      if (!list || !list.length) return '';
      var imgs = list.filter(function (f) { return f.kind === 'image'; });
      var docs = list.filter(function (f) { return f.kind !== 'image'; });
      var h = '';
      if (imgs.length) h += '<ul class="fgrid">' + imgs.map(function (f) { return fileCardHtml(f, removable); }).join('') + '</ul>';
      if (docs.length) h += '<ul class="frows">' + docs.map(function (f) {
        var isL = f.kind === 'link';
        return '<li' + (freshIds && freshIds[f.id] ? ' class="fresh"' : '') + '><a href="' + esc(f.url) + '" target="_blank" rel="noopener noreferrer">' + (isL ? LINK_SM : FILE_SM) + '<span>' + esc(f.name) + '</span><small>' + (isL ? 'Visit' : 'Open') + '</small></a>' +
          (removable ? '<button type="button" class="chip" data-rm-file="' + esc(f.id) + '" aria-label="Remove ' + esc(f.name) + '">' + X_ICON + '</button>' : '') + '</li>';
      }).join('') + '</ul>';
      return h;
    }

    function sheetHtml(it) {
      var k = kindOf(it);
      var who = it.side === 'K' ? 'Knox' : 'You';
      var badge = k === 'done' ? '<span class="badge done">' + CHECK + ' Completed</span>'
        : k === 'needs' ? '<span class="badge needs">Knox is asking you</span>'
        : '<span class="badge open">Waiting on Knox</span>';
      var h = '<div class="grab" aria-hidden="true"></div>' +
        '<div class="head"><h3 id="sheet-title">' + esc(it.title) + '</h3><button type="button" class="close" data-close aria-label="Close">' + X_ICON + '</button></div>' +
        badge +
        '<div class="meta">' + who + ' asked · ' + esc(rel(it.created)) + '</div>';

      if (it.notes) h += '<div class="block"><h4>Details</h4><div class="desc">' + esc(it.notes) + '</div></div>';
      if (it.files && it.files.length) h += '<div class="block"><h4>' + (it.side === 'K' ? 'From Knox' : 'Your files') + '</h4>' + filesHtml(it.files, false) + '</div>';

      if (k === 'done') {
        var answerer = it.side === 'K' ? 'Your answer' : "Knox's answer";
        var txt = (it.response || '').trim();
        var rf = it.responseFiles || [];
        h += '<div class="block"><h4>' + answerer + '</h4>';
        if (txt || rf.length) h += '<div class="answer">' + (txt ? '<div class="desc">' + esc(txt) + '</div>' : '') + filesHtml(rf, false) + '</div>';
        else h += '<div class="answer none">Checked off, no note.</div>';
        h += '</div>';
        h += '<div class="actions">' +
          '<button type="button" class="btn" data-act="reopen">Put it back</button>' +
          (it.url ? '<a class="btn" href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">Open in Notion</a>' : '') +
          '<button type="button" class="btn danger" data-act="remove">' + TRASH + ' Remove</button>' +
        '</div>';
      } else if (k === 'needs') {
        h += '<div class="block"><h4>Your answer</h4>' +
          '<textarea id="sheet-answer" placeholder="Type a note, or just add a file and send."></textarea>' +
          '<div class="chips" id="sheet-chips" style="margin-top:8px"></div>' +
          '<div class="actions">' +
            '<button type="button" class="btn" data-act="pick">' + CLIP + ' Add files</button>' +
            '<input type="file" id="sheet-file" multiple hidden>' +
            '<button type="button" class="btn primary" data-act="answer">Send answer</button>' +
            '<button type="button" class="btn" data-act="done">Just check off</button>' +
          '</div>' +
          '<p class="status" id="sheet-status" role="status" aria-live="polite"></p>' +
        '</div>' +
        '<div class="actions">' +
          (it.url ? '<a class="btn" href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">Open in Notion</a>' : '') +
          '<button type="button" class="btn danger" data-act="remove">' + TRASH + ' Remove</button>' +
        '</div>';
      } else {
        h += '<div class="block"><div class="answer none">Knox hasn\'t answered yet. A blue dot will show up here when he does.</div></div>' +
          '<div class="actions">' +
            '<button type="button" class="btn" data-act="done">' + CHECK + ' I handled it</button>' +
            (it.url ? '<a class="btn" href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">Open in Notion</a>' : '') +
            '<button type="button" class="btn danger" data-act="remove">' + TRASH + ' Remove</button>' +
          '</div>';
      }
      return h;
    }

    function shelfHtml() {
      var fresh = {};
      newShelf().forEach(function (f) { fresh[f.id] = true; });
      return '<div class="grab" aria-hidden="true"></div>' +
        '<div class="head"><h3 id="sheet-title">Files from Knox</h3><button type="button" class="close" data-close aria-label="Close">' + X_ICON + '</button></div>' +
        '<div class="meta">Things Knox dropped for you outside any ask. Photos open full screen, files open in a new tab.</div>' +
        '<div class="block">' + (files.length ? filesHtml(files, true, fresh) : '<div class="answer none">Nothing here right now.</div>') + '</div>';
    }

    function renderSheet() {
      if (!sheetItem) return;
      var draft = $('sheet-answer') ? $('sheet-answer').value : '';
      $('sheet').innerHTML = sheetItem === 'files' ? shelfHtml() : sheetHtml(sheetItem);
      if ($('sheet-answer')) { $('sheet-answer').value = draft; renderSheetChips(); }
    }

    function renderSheetChips() {
      var box = $('sheet-chips');
      if (!box) return;
      box.innerHTML = sheetQueue.map(function (p, i) {
        return '<button type="button" class="chip" data-sheet-unqueue="' + i + '" aria-label="Remove ' + esc(pendingName(p)) + '">' + (isLink(p) ? LINK_SM : CLIP) + '<span>' + esc(pendingName(p)) + '</span><span class="x">' + X_ICON + '</span></button>';
      }).join('');
    }

    function openSheet(target) {
      sheetItem = target;
      sheetQueue = [];
      if (target !== 'files') { markSeen(target); render(); }
      renderSheet();
      $('scrim').classList.add('show');
      $('sheet').classList.add('show');
      $('sheet').scrollTop = 0;
      var c = $('sheet').querySelector('[data-close]');
      if (c) c.focus();
      // seeing the shelf once is enough; the highlight goes when it closes
      if (target === 'files') { markShelfSeen(); }
    }

    function closeSheet() {
      var wasShelf = sheetItem === 'files';
      sheetItem = null;
      sheetQueue = [];
      $('scrim').classList.remove('show');
      $('sheet').classList.remove('show');
      $('sheet').innerHTML = '';
      if (wasShelf) renderFiles();
    }

    function setSheetStatus(msg, kind) {
      var el = $('sheet-status');
      if (!el) return;
      el.textContent = msg || '';
      el.className = 'status' + (kind ? ' ' + kind : '');
    }

    // ---------- API ----------
    function api(body) {
      return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; }); });
    }

    var loading = false;
    function load() {
      if (loading) return;
      loading = true;
      loadFiles();
      fetch(API, { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (j) {
          var saving = items.filter(function (i) { return i.saving; });
          items = (j.items || []).concat(saving);
          // his own edits move the row's edited time; that is not news to him.
          // Notion reports the new time a little late, so keep marking for two minutes.
          items.forEach(function (i) {
            var t = justActed[i.id];
            if (!t) return;
            if (Date.now() - t < 120000) markSeen(i); else delete justActed[i.id];
          });
          render();
          // keep an open sheet pointed at the fresh copy of its item
          if (sheetItem && sheetItem !== 'files') {
            var fresh = byId(sheetItem.id);
            if (fresh && (fresh.done !== sheetItem.done || fresh.response !== sheetItem.response || (fresh.responseFiles || []).length !== (sheetItem.responseFiles || []).length || (fresh.files || []).length !== (sheetItem.files || []).length)) {
              sheetItem = fresh; renderSheet();
            } else if (fresh) { sheetItem = fresh; }
          }
        })
        .catch(function () { setStatus("Couldn't reach the list. Check the connection and try again.", 'err'); })
        .then(function () { loading = false; });
    }

    function loadFiles() {
      fetch(API + '/files', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : { files: files }; })
        .then(function (j) { files = j.files || []; renderFiles(); })
        .catch(function () {});
    }

    // Heartbeat: every 15 seconds while the page is visible, ask for the
    // cheap fingerprint of the list; reload only when it moved. This is what
    // makes Knox's sends show up here without a refresh.
    var lastVersion = null;
    function checkVersion() {
      if (document.visibilityState !== 'visible') return;
      fetch(API + '/version', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          if (!j || !j.v) return;
          if (lastVersion !== null && j.v !== lastVersion) load();
          lastVersion = j.v;
        })
        .catch(function () {});
    }

    // Phone photos run big; shrink them before upload so the store stays lean.
    function shrinkImage(file) {
      return new Promise(function (resolve) {
        if (!/^image\//.test(file.type) || file.size <= 1.5 * 1024 * 1024) return resolve(file);
        var img = new Image();
        var url = URL.createObjectURL(file);
        img.onload = function () {
          try {
            var max = 2000;
            var scale = Math.min(1, max / Math.max(img.width, img.height));
            var c = document.createElement('canvas');
            c.width = Math.round(img.width * scale);
            c.height = Math.round(img.height * scale);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            c.toBlob(function (blob) {
              URL.revokeObjectURL(url);
              if (!blob) return resolve(file);
              resolve(new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' }));
            }, 'image/jpeg', 0.85);
          } catch (e) { URL.revokeObjectURL(url); resolve(file); }
        };
        img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
        img.src = url;
      });
    }

    // straight to the Blob store, then the dashboard records the link in Notion
    // extra: {section:'response', by:'B'} puts the file under the answer heading
    function upload(pageId, file, extra) {
      return shrinkImage(file).then(function (f) {
        if (f.size > MAX_BYTES) throw new Error(f.name + ' is over 500 MB.');
        if (!window.blobUpload) throw new Error("The uploader didn't load. Refresh the page and try again.");
        return window.blobUpload('blake/' + f.name, f, {
          access: 'public',
          handleUploadUrl: API + '/blob',
          multipart: f.size > 8 * 1024 * 1024,
          contentType: f.type || 'application/octet-stream',
        }).then(function (blob) {
          var body = Object.assign({ url: blob.url, name: f.name, contentType: f.type || '' }, pageId ? { pageId: pageId } : {}, extra || {});
          return fetch(API + '/attach', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
            .then(function (r) { if (!r.ok) throw new Error("Couldn't attach " + f.name + '.'); });
        }, function () {
          throw new Error("Couldn't upload " + f.name + '. Check the connection and try again.');
        });
      });
    }

    // a web link, saved on the page as a bookmark
    function attachLink(pageId, link, extra) {
      var name = link;
      try { var u = new URL(link); name = u.hostname.replace(/^www\./, '') + (u.pathname !== '/' ? u.pathname : '') + (u.search || ''); } catch (e) {}
      var body = Object.assign({ link: link, name: name.slice(0, 80) }, pageId ? { pageId: pageId } : {}, extra || {});
      return fetch(API + '/attach', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        .then(function (r) { if (!r.ok) throw new Error("Couldn't attach the link " + name + '.'); });
    }

    function sendOne(pageId, p, extra) { return isLink(p) ? attachLink(pageId, p.link, extra) : upload(pageId, p, extra); }

    function uploadAll(pageId, list, extra, onProgress) {
      var chain = Promise.resolve();
      var failed = [];
      list.forEach(function (p, n) {
        chain = chain.then(function () {
          onProgress(n + 1, list.length);
          return sendOne(pageId, p, extra).catch(function (err) { failed.push(err.message); });
        });
      });
      return chain.then(function () { return failed; });
    }

    function linksFromDrop(dt) {
      var raw = dt.getData('text/uri-list') || dt.getData('text/plain') || '';
      return raw.split(/\r?\n/).map(function (s) { return s.trim(); }).filter(function (s) { return s && s.charAt(0) !== '#' && /^https?:\/\//i.test(s); });
    }
    function hasPayload(dt) { return !!dt && (Array.prototype.indexOf.call(dt.types, 'Files') >= 0 || Array.prototype.indexOf.call(dt.types, 'text/uri-list') >= 0); }

    // ---------- quick add ----------
    function setDetailsToggle(open) {
      $('toggle-notes').innerHTML = open ? 'Hide details' : DETAILS_ICON + ' Add details';
    }

    function openQuick() {
      $('quick').classList.add('open');
      setTimeout(function () { $('title').focus(); }, 30);
    }

    function closeQuick() {
      $('quick').classList.remove('open');
      $('notes').hidden = true;
      $('link-input').classList.remove('show');
      setDetailsToggle(false);
    }

    function queueLink(raw) {
      var l = (raw || '').trim();
      if (!/^https?:\/\//i.test(l)) { setStatus('That doesn\'t look like a link. It should start with http.', 'err'); return false; }
      queued.push({ link: l }); renderQueue(); setStatus('');
      return true;
    }

    $('quick-open').addEventListener('click', openQuick);
    $('quick-cancel').addEventListener('click', function () { $('title').value = ''; $('notes').value = ''; $('link-input').value = ''; queued = []; renderQueue(); setStatus(''); closeQuick(); });
    $('toggle-notes').addEventListener('click', function () {
      var show = $('notes').hidden;
      $('notes').hidden = !show;
      setDetailsToggle(show);
      if (show) $('notes').focus();
    });
    $('toggle-link').addEventListener('click', function () {
      var li = $('link-input');
      li.classList.toggle('show');
      if (li.classList.contains('show')) li.focus();
    });
    $('link-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); if (queueLink(this.value)) this.value = ''; }
      if (e.key === 'Escape') { this.classList.remove('show'); }
    });
    $('link-input').addEventListener('paste', function (e) {
      var t = (e.clipboardData.getData('text') || '').trim();
      if (/^https?:\/\/\S+$/i.test(t)) { e.preventDefault(); if (queueLink(t)) this.value = ''; }
    });
    $('pick-files').addEventListener('click', function () { $('file-input').click(); });
    $('file-input').addEventListener('change', function () {
      Array.prototype.forEach.call($('file-input').files, function (f) { if (f.size <= MAX_BYTES) queued.push(f); else setStatus(f.name + ' is over 500 MB.', 'err'); });
      $('file-input').value = '';
      renderQueue();
    });
    $('file-list').addEventListener('click', function (e) {
      var b = e.target.closest('[data-unqueue]');
      if (!b) return;
      queued.splice(Number(b.getAttribute('data-unqueue')), 1);
      renderQueue();
    });
    $('title').addEventListener('keydown', function (e) { if (e.key === 'Escape') $('quick-cancel').click(); });

    $('add-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var title = $('title').value.trim();
      var notes = $('notes').value.trim();
      if (!title) { setStatus('Type what you need first.', 'err'); $('title').focus(); return; }

      var toSend = queued.slice();
      queued = []; renderQueue();
      $('title').value = ''; $('notes').value = ''; $('link-input').value = '';
      $('add-btn').disabled = true;
      setStatus('Sending…');

      var temp = { id: 'temp-' + Date.now(), title: title, notes: notes, done: false, side: 'B', files: [], responseFiles: [], created: new Date().toISOString(), saving: 'Sending…' };
      items.push(temp); render();

      api({ action: 'add', title: title, notes: notes, side: 'B' })
        .then(function (j) {
          var real = Object.assign({ files: [], responseFiles: [] }, j.item);
          var idx = items.indexOf(temp);
          if (idx >= 0) items[idx] = Object.assign(real, { saving: toSend.length ? 'Attaching…' : '' });
          render();
          return uploadAll(real.id, toSend, null, function (n, total) {
            var cur = byId(real.id);
            if (cur) { cur.saving = 'Attaching ' + n + ' of ' + total + '…'; render(); }
            setStatus('Sending ' + n + ' of ' + total + '…');
          }).then(function (failed) {
            var cur = byId(real.id);
            if (cur) { cur.saving = ''; render(); }
            if (failed.length) setStatus('Sent, but ' + failed.join(' '), 'err');
            else { setStatus(toSend.length ? 'Sent with ' + nitems(toSend.length) + '.' : 'Sent.', 'ok'); closeQuick(); }
            if (toSend.length) load();
            setTimeout(function () { setStatus(''); }, 4000);
          });
        })
        .catch(function () {
          items = items.filter(function (i) { return i !== temp; }); render();
          $('title').value = title; $('notes').value = notes; if (notes) { $('notes').hidden = false; setDetailsToggle(true); }
          queued = toSend; renderQueue();
          setStatus("That didn't send. Check the connection and tap Send again.", 'err');
        })
        .then(function () { $('add-btn').disabled = false; });
    });

    // ---------- drop anywhere on the page ----------
    // Files or links dropped anywhere land where they make sense: into the
    // answer when one of Knox's asks is open, otherwise into a new ask.
    var dragDepth = 0;
    function showOverlay() {
      var answering = sheetItem && sheetItem !== 'files' && kindOf(sheetItem) === 'needs';
      $('drop-text').textContent = answering ? 'Drop to add to your answer' : 'Drop to send to Knox';
      $('drop-overlay').classList.add('show');
    }
    function hideOverlay() { dragDepth = 0; $('drop-overlay').classList.remove('show'); }
    function routeDrop(fileList, links) {
      var answering = sheetItem && sheetItem !== 'files' && kindOf(sheetItem) === 'needs';
      var tooBig = [];
      var accepted = [];
      Array.prototype.forEach.call(fileList, function (f) { if (f.size <= MAX_BYTES) accepted.push(f); else tooBig.push(f.name); });
      links.forEach(function (l) { accepted.push({ link: l }); });
      if (answering) {
        accepted.forEach(function (p) { sheetQueue.push(p); });
        renderSheetChips();
        if (tooBig.length) setSheetStatus(tooBig.join(', ') + ' is over 500 MB.', 'err');
        return;
      }
      if (sheetItem) closeSheet();
      accepted.forEach(function (p) { queued.push(p); });
      renderQueue();
      openQuick();
      setStatus(tooBig.length ? tooBig.join(', ') + ' is over 500 MB.' : (accepted.length ? 'Added. Type what it is, then Send.' : ''), tooBig.length ? 'err' : '');
    }
    document.addEventListener('dragenter', function (e) { if (!hasPayload(e.dataTransfer)) return; e.preventDefault(); dragDepth++; showOverlay(); });
    document.addEventListener('dragover', function (e) { if (!hasPayload(e.dataTransfer)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
    document.addEventListener('dragleave', function (e) { if (!hasPayload(e.dataTransfer)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) hideOverlay(); });
    document.addEventListener('drop', function (e) {
      if (!hasPayload(e.dataTransfer)) return;
      e.preventDefault();
      hideOverlay();
      var fileList = e.dataTransfer.files;
      var links = fileList.length ? [] : linksFromDrop(e.dataTransfer);
      if (!fileList.length && !links.length) return;
      routeDrop(fileList, links);
    });
    window.addEventListener('blur', hideOverlay);

    // ---------- list clicks ----------
    document.querySelector('main').addEventListener('click', function (e) {
      var b = e.target.closest('[data-open]');
      if (!b) return;
      var it = byId(b.getAttribute('data-open'));
      if (it && !it.saving) openSheet(it);
    });
    $('files-btn').addEventListener('click', function () { openSheet('files'); });
    $('banner-btn').addEventListener('click', function () { openSheet('files'); });

    // ---------- sheet clicks ----------
    $('scrim').addEventListener('click', closeSheet);
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if ($('lightbox').classList.contains('show')) { closeLightbox(); return; }
      if (sheetItem) closeSheet();
    });

    $('sheet').addEventListener('click', function (e) {
      if (e.target.closest('[data-close]')) { closeSheet(); return; }
      var unq = e.target.closest('[data-sheet-unqueue]');
      if (unq) { sheetQueue.splice(Number(unq.getAttribute('data-sheet-unqueue')), 1); renderSheetChips(); return; }
      var btn = e.target.closest('[data-act]');
      if (!btn || !sheetItem || sheetItem === 'files') return;
      var it = sheetItem;
      var act = btn.getAttribute('data-act');

      if (act === 'pick') { $('sheet-file').click(); return; }

      if (act === 'done' || act === 'reopen') {
        var was = it.done;
        it.done = act === 'done';
        justActed[it.id] = Date.now();
        markSeen(it); render(); closeSheet();
        api({ action: 'toggle', id: it.id, done: it.done }).then(function () { setTimeout(load, 1500); setTimeout(load, 7000); }).catch(function () {
          it.done = was; render();
          setStatus("Couldn't save that change. Try again.", 'err');
        });
        return;
      }

      if (act === 'remove') {
        if (!confirm('Take "' + it.title + '" off the list for good?')) return;
        var keep = items.slice();
        items = items.filter(function (i) { return i.id !== it.id; }); render(); closeSheet();
        api({ action: 'remove', id: it.id }).catch(function () {
          items = keep; render();
          setStatus("Couldn't remove that. Try again.", 'err');
        });
        return;
      }

      if (act === 'answer') {
        var text = ($('sheet-answer') ? $('sheet-answer').value : '').trim();
        var toSend = sheetQueue.slice();
        if (!text && !toSend.length) { setSheetStatus('Type a note or add a file before sending.', 'err'); return; }
        var buttons = $('sheet').querySelectorAll('button[data-act]');
        buttons.forEach(function (x) { x.disabled = true; });
        setSheetStatus('Sending…');
        api({ action: 'respond', id: it.id, text: text })
          .then(function () {
            return uploadAll(it.id, toSend, { section: 'response', by: 'B' }, function (n, total) { setSheetStatus('Sending ' + n + ' of ' + total + '…'); });
          })
          .then(function (failed) {
            it.done = true; it.response = text;
            justActed[it.id] = Date.now();
            markSeen(it); render(); closeSheet();
            if (failed.length) setStatus('Answered, but ' + failed.join(' '), 'err');
            load();
            setTimeout(load, 7000);
          })
          .catch(function () {
            buttons.forEach(function (x) { x.disabled = false; });
            setSheetStatus("That didn't send. Try again.", 'err');
          });
      }
    });

    $('sheet').addEventListener('change', function (e) {
      var input = e.target.closest('#sheet-file');
      if (!input) return;
      Array.prototype.forEach.call(input.files, function (f) { if (f.size <= MAX_BYTES) sheetQueue.push(f); else setSheetStatus(f.name + ' is over 500 MB.', 'err'); });
      input.value = '';
      renderSheetChips();
    });

    // ---------- photos anywhere, and removing shelf files ----------
    document.addEventListener('click', function (e) {
      var lb = e.target.closest('[data-lb-src]');
      if (lb) {
        $('lightbox-img').src = lb.getAttribute('data-lb-src');
        $('lightbox-cap').textContent = lb.getAttribute('data-lb-cap') || '';
        $('lightbox').classList.add('show');
        return;
      }
      var x = e.target.closest('[data-rm-file]');
      if (!x) return;
      var fid = x.getAttribute('data-rm-file');
      var g = files.filter(function (q) { return q.id === fid; })[0];
      if (!g || !confirm('Remove "' + g.name + '"?')) return;
      var keepFiles = files.slice();
      files = files.filter(function (q) { return q !== g; }); renderFiles();
      fetch(API + '/files', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'remove', id: g.id }) })
        .then(function (r) { if (!r.ok) throw new Error(); })
        .catch(function () { files = keepFiles; renderFiles(); setStatus("Couldn't remove that file. Try again.", 'err'); });
    });

    function closeLightbox() { $('lightbox').classList.remove('show'); $('lightbox-img').src = ''; }
    $('lightbox').addEventListener('click', closeLightbox);

    // ---------- keep fresh ----------
    load();
    checkVersion();
    setInterval(checkVersion, 15000);
    setInterval(load, 300000);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') { load(); checkVersion(); } });
  </script>
</body>
</html>
